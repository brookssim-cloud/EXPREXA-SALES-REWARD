    const pending = subs.filter(s=>s.status === 'pending');
    const value = pending.reduce((t,s)=> t + Number(s.billingValue||0), 0);
    const withRef = pending.filter(s=>s.referrerId).length;
    if(!pending.length) return `<div class="card"><div class="empty">Nothing waiting for review.</div></div>`;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${pending.length}</div><div class="l">Pending review</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">RM ${rm(value)}</div><div class="l">Value pending</div></div>
        <div class="stat"><div class="n">${withRef}</div><div class="l">Naming a referrer</div></div>
      </div>
      ${withRef ? `<div class="banner b-blue">${withRef} of these name a referrer — approving them awards the same points to both workers.</div>` : ''}
      ${filterBar('fp')}
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Value</th><th>Points</th><th></th></tr>
        ${pending.map(s=>{
          const p = projectedPoints(s, settings);
          return `<tr${rowKeys(s)}>
            <td><b>${esc(s.workerName)}</b>${s.referrerId?`<div class="tagline t-ref">+ ${esc(s.referrerName)} · referral</div>`:''}</td>
            <td>${esc(subTitle(s))}<div class="xs muted">${esc(saleTypeLabel(s.saleType))}</div>
                <div class="xs muted">Ordered ${fmtDate(s.submittedAt)}</div></td>
            <td class="nb">${esc(s.invoiceNo)}<div class="xs muted">${esc(s.pickupNo||'—')}</div></td>
            <td>${docLinks(s)}</td>
            <td class="nb">RM ${rm(s.billingValue)}</td>
            <td><b>${pts(p.points)}</b>${p.mult>1?`<div class="tagline t-boost">${esc(String(p.mult))}× SPIFF</div>`:''}
                ${s.referrerId?`<div class="tagline t-ref">×2 payees</div>`:''}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-sm btn-gold" data-ok="${esc(s.id)}">Approve</button>
              <button class="btn btn-sm btn-ghost" data-no="${esc(s.id)}">Reject</button>
            </td></tr>`;
        }).join('')}
      </table></div>
      <div class="card hid" id="fp-none"><div class="empty">No sale matches that search.</div></div>
      <div class="xs muted">All four documents and the invoice figures are in on every row here. The boost shown is the one that was live on the order date, which is what will be awarded.</div>`;
  }

  // ---------- In progress ----------
  // Sales still collecting documents. Nothing to approve yet; this is for
  // seeing what is outstanding and chasing it.
  function viewProgress(subs, settings){
    const open = subs.filter(s=>s.status === 'collecting')
      .sort((a,b)=> String(a.submittedAt||'').localeCompare(String(b.submittedAt||'')));
    if(!open.length) return `<div class="card"><div class="empty">Nothing in progress.</div></div>`;
    const projected = open.reduce((t,s)=> t + projectedPoints(s, settings).points, 0);
    const waiting = st => open.filter(s => (nextStage(s)||{}).id === st).length;
    const age = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/86400000));
    return `
      <div class="stats">
        <div class="stat"><div class="n">${open.length}</div><div class="l">Sales in progress</div></div>
        <div class="stat"><div class="n">${open.filter(s=>s.saleType==='upsell').length}</div><div class="l">Upsells (3-stage)</div></div>
        <div class="stat"><div class="n">${waiting('pod')}</div><div class="l">Awaiting delivery proof</div></div>
      </div>
      <div class="xs muted">Cancel is for a client pulling out before delivery — it closes the sale without blaming the worker. After delivery, approve or reject instead.</div>
      <div class="banner b-grey">${pts(projected)} pts projected across these — not awarded until every document is in and approved. Sales without an invoice yet have no value to count.</div>
      ${filterBar('fg')}
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Waiting on</th><th>Value</th><th>Age</th><th></th></tr>
        ${open.map(s=>{
          const nx = nextStage(s);
          const days = age(s.submittedAt);
          return `<tr${rowKeys(s)}>
            <td><b>${esc(s.workerName)}</b></td>
            <td>${esc(subTitle(s))}<div class="xs muted">${esc(saleTypeLabel(s.saleType))}</div></td>
            <td class="xs nb">${s.invoiceNo ? esc(s.invoiceNo) : '<span class="muted">not invoiced</span>'}</td>
            <td>${docLinks(s)}</td>
            <td>${nx?`<span class="chip c-hold">${esc(nx.doc)}</span>`:''}</td>
            <td class="nb">${hasValue(s) ? 'RM ' + rm(s.billingValue) : '<span class="muted">—</span>'}</td>
            <td class="xs ${days>30?'':'muted'}" ${days>30?'style="color:var(--red);font-weight:700;"':''}>${days} days</td>
            <td><button class="btn btn-sm btn-danger" data-cancel="${esc(s.id)}">Cancel</button></td>
          </tr>`;
        }).join('')}
      </table></div>
      <div class="card hid" id="fg-none"><div class="empty">No sale matches that search.</div></div>
`;
  }

  function wirePending(subs, settings){
    document.querySelectorAll('[data-ok]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.ok);
        if(!sub) return;
        const who = sub.referrerId ? `${sub.workerName} and ${sub.referrerName}` : sub.workerName;
        const p = projectedPoints(sub, settings);
        if(!confirm(`Approve this sale?\n\n${pts(p.points)} pts to ${who}.\n`
          + `Straight into the pool — delivery is already proven, so there is no hold.`)) return;
        b.disabled = true; b.textContent = 'Approving…';
        try{
          const r = await approveSubmission(sub, settings);
          toast(`Approved — ${pts(r.points)} pts${sub.referrerId?' each':''}`);
          renderAdmin('pending');
        }catch(e){
          console.error('approve failed:', e);
          b.disabled = false; b.textContent = 'Approve';
          toast('Could not approve — try again');
        }
      };
    });
    document.querySelectorAll('[data-no]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.no);
        if(!sub) return;
        const reason = prompt('Why is this being rejected?\nThe worker sees this and can fix and resubmit.');
        if(reason === null) return;
        if(!reason.trim()) return toast('A reason is needed');
        b.disabled = true;
        const ok = await rejectSubmission(sub, reason.trim());
        toast(ok ? 'Rejected' : 'Could not reject');
        renderAdmin('pending');
      };
    });
  }

  // ---------- Hold ----------
  // ---------- Approved ----------
  function viewApproved(subs, awards){
    const approved = subs.filter(s=>s.status === 'approved');
    if(!approved.length) return `<div class="card"><div class="empty">Nothing approved yet.</div></div>`;
    const cleared = awards;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${approved.length}</div><div class="l">Approved</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">${pts(sumPts(awards))} pts</div><div class="l">Points awarded — incl referral</div></div>
        <div class="stat"><div class="n">RM ${rm(sumPts(cleared) * RM_PER_POINT)}</div><div class="l">Awaiting payout</div></div>
      </div>
      ${filterBar('fa')}
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Type</th><th>Points awarded</th><th>Approved</th><th>Status</th></tr>
        ${approved.map(s=>{
          const own = awards.find(a=>a.submissionId===s.id && a.kind==='own');
          const ref = awards.find(a=>a.submissionId===s.id && a.kind==='referral');
          const state = own ? '<span class="chip c-pool">In pool</span>'
                            : '<span class="chip c-pend">—</span>';
          return `<tr${rowKeys(s)}>
            <td><b>${esc(s.workerName)}</b></td>
            <td>${esc(subTitle(s))}</td>
            <td class="xs nb">${esc(s.invoiceNo||'—')}</td>
            <td>${docLinks(s)}</td>
            <td class="xs">${esc(saleTypeLabel(s.saleType))}</td>
            <td><b>${pts(s.awardedPoints)}</b>
                <div class="xs muted">RM ${rm(s.billingValue)}${Number(s.multiplier)>1?' × '+s.multiplier+' SPIFF':' · no boost'}</div>
                ${ref?`<div class="tagline t-ref">+ ${pts(ref.points)} pts → ${esc(s.referrerName)}</div>`:''}</td>
            <td class="xs muted">${fmtDate(s.approvedAt)}</td>
            <td>${state}</td>
          </tr>`;
        }).join('')}
      </table></div>
      <div class="card hid" id="fa-none"><div class="empty">No sale matches that search.</div></div>
      <div class="xs muted">Points are final at whatever SPIFF was live on the approval date — ending a boost later never changes a sale already approved.</div>`;
  }

  // ---------- Rejected ----------
  // ---------- Closed ----------
  // Rejections and cancellations together: both end a sale, for different
  // reasons, and an admin looking for "what happened to that job" should not
  // have to guess which of two tabs it fell into.
  function viewClosed(subs){
    const closed = subs.filter(s => s.status === 'rejected' || s.status === 'cancelled')
      .sort((a,b)=> String(b.rejectedAt||b.cancelledAt||'').localeCompare(String(a.rejectedAt||a.cancelledAt||'')));
    if(!closed.length) return `<div class="card"><div class="empty">Nothing closed.</div></div>`;
    const cancelled = closed.filter(s=>s.status === 'cancelled').length;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${closed.length - cancelled}</div><div class="l">Rejected</div></div>
        <div class="stat"><div class="n">${cancelled}</div><div class="l">Cancelled by client</div></div>
      </div>
      ${filterBar('fc')}
      <div class="wrap"><table class="t">
      <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Value</th><th>Outcome</th><th>Reason</th><th>When</th></tr>
      ${closed.map(s=>{
        const was = s.status === 'cancelled';
        return `<tr${rowKeys(s)}>
        <td><b>${esc(s.workerName)}</b></td>
        <td>${esc(subTitle(s))}</td>
        <td class="xs nb">${esc(s.invoiceNo||'—')}</td>
        <td>${docLinks(s)}</td>
        <td class="nb">${hasValue(s) ? 'RM ' + rm(s.billingValue) : '—'}</td>
        <td><span class="chip ${was?'c-pend':'c-rej'}">${was?'Cancelled':'Rejected'}</span></td>
        <td class="sm" style="color:${was?'var(--muted)':'var(--red)'};">${esc(s.rejectReason||s.cancelReason||'—')}</td>
        <td class="xs muted">${fmtDate(s.rejectedAt||s.cancelledAt)}</td>
      </tr>`;}).join('')}
    </table></div>
      <div class="card hid" id="fc-none"><div class="empty">No sale matches that search.</div></div>
    <div class="xs muted">A rejected sale stays with the worker, who can correct it and submit again. A cancelled one is closed for good.</div>`;
  }

  // ---------- Customers ----------
  function viewCustomers(customers, subs){
    const live = liveCustomers(customers);
    const archived = customers.filter(c=>c.archived);
    const used = {};
    subs.forEach(s=>{ if(s.billingName) used[s.billingName] = (used[s.billingName]||0) + 1; });
    const row = c => `<tr>
      <td><b>${esc(c.name)}</b>${c.archived?' <span class="chip c-pend">Archived</span>':''}</td>
      <td class="xs muted">${fmtDate(c.createdAt)}</td>
      <td>${used[c.name] ? used[c.name] + ' sale' + (used[c.name]===1?'':'s') : '<span class="muted">none yet</span>'}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm ${c.archived?'btn-ghost':'btn-danger'}" data-arch="${esc(c.id)}">
          ${c.archived ? 'Restore' : 'Archive'}</button>
      </td></tr>`;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${live.length}</div><div class="l">Customers on file</div></div>
        <div class="stat"><div class="n">${Object.keys(used).length}</div><div class="l">With a sale recorded</div></div>
        <div class="stat"><div class="n">${archived.length}</div><div class="l">Archived</div></div>
      </div>

      <div class="card">
        <h3>Add a customer</h3>
        <div class="sm muted" style="margin-bottom:12px;">These are the clients a worker can pick when submitting an upsell. Anything not on this list cannot be recorded as an upsell.</div>
        <div class="field"><label>Customer name</label>
          <input id="cu-name" placeholder="e.g. ABC Trading Sdn Bhd"></div>
        <button class="btn btn-primary" id="cu-add">Add customer</button>
        <div id="cu-msg" class="sm" style="margin-top:10px;"></div>
      </div>

      ${customers.length ? `<div class="wrap"><table class="t">
        <tr><th>Customer</th><th>Added</th><th>Sales</th><th></th></tr>
        ${live.map(row).join('')}${archived.map(row).join('')}
      </table></div>
      <div class="xs muted">Archiving only takes a customer out of the worker's picker. Sales already recorded against them keep their name.</div>`
      : `<div class="card"><div class="empty">No customers yet. Add the first one above.</div></div>`}`;
  }

  function wireCustomers(customers){
    $('cu-add').onclick = async function(){
      const name = $('cu-name').value.trim();
      const msg = $('cu-msg');
      msg.style.color = 'var(--red)';
      if(!name){ msg.textContent = 'Enter a customer name.'; return; }
      // Same name twice would give the worker two identical-looking options
      // and split that client's history across both.
      if(customers.some(c => String(c.name||'').toLowerCase() === name.toLowerCase())){
        msg.textContent = 'That customer is already on the list.'; return;
      }
      this.disabled = true; this.textContent = 'Adding…';
      const ok = await saveCustomer({ id:uid(), name, createdAt:new Date().toISOString(), archived:false });
      if(!ok){
        this.disabled = false; this.textContent = 'Add customer';
        msg.textContent = 'Could not add — try again.'; return;
      }
      toast('Customer added');
      renderAdmin('customers');
    };
    document.querySelectorAll('[data-arch]').forEach(b=>{
      b.onclick = async () => {
        const c = customers.find(x => x.id === b.dataset.arch);
        if(!c) return;
        b.disabled = true;
        const ok = await saveCustomer(Object.assign({}, c, { archived: !c.archived }));
        toast(ok ? (c.archived ? 'Restored' : 'Archived') : 'Could not save');
        renderAdmin('customers');
      };
    });
  }

  // ---------- Cancelling ----------
  // A client pulling out mid-job is not a rejection — nobody did anything
  // wrong, the sale simply stopped existing. It is only offered while the
  // sale is still being collected: once delivery is proven there is nothing
  // left to cancel, and approve or reject is the honest choice.
  function wireProgress(subs){
    document.querySelectorAll('[data-cancel]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s => s.id === b.dataset.cancel);
        if(!sub) return;
        const reason = prompt('Why is this being cancelled?\nThe worker sees this on their My Pool.');
        if(reason === null) return;
        if(!reason.trim()) return toast('A reason is needed');
        b.disabled = true; b.textContent = 'Cancelling…';
        try{
          await db.collection('epx_sales_submissions').doc(sub.id).set(
            Object.assign({}, sub, {
              status:'cancelled', cancelReason:reason.trim(),
              cancelledAt:new Date().toISOString()
            }));
          toast('Cancelled');
          renderAdmin('progress');
        }catch(e){
          console.error('cancel failed:', e);
          b.disabled = false; b.textContent = 'Cancel';
          toast('Could not cancel — try again');
        }
      };
    });
  }

  // ---------- Rewards ----------
  function viewRewards(s){
    const tierRow = (t,i) => `
      <div class="tgrid" style="margin-bottom:8px;" data-tier="${i}">
        <input class="ti-th" inputmode="numeric" value="${esc(t.threshold)}" placeholder="Points">
        <input class="ti-bo" inputmode="decimal" value="${esc(t.bonus)}" placeholder="RM bonus">
        <button class="btn btn-sm btn-danger" data-rmtier="${i}">✕</button>
      </div>`;
    const spiffRow = (sp,i) => `
      <div class="card" style="padding:12px;margin-bottom:10px;" data-spiff="${i}">
        <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap;">
          <div class="field" style="flex:1 1 140px;margin:0;">
            <label>Boosted sale type</label>
            <select class="sp-type">${SALE_TYPES.map(t=>
              `<option value="${t.id}"${t.id===sp.saleType?' selected':''}>${esc(t.label)}</option>`).join('')}</select>
          </div>
          <div class="field" style="width:84px;margin:0;">
            <label>Mult.</label><input class="sp-mult" inputmode="decimal" value="${esc(sp.multiplier)}">
          </div>
          <button class="btn btn-sm btn-danger" data-rmspiff="${i}">✕</button>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="field" style="flex:1;margin:0;"><label>Starts</label><input type="date" class="sp-start" value="${esc(sp.start||'')}"></div>
          <div class="field" style="flex:1;margin:0;"><label>Ends</label><input type="date" class="sp-end" value="${esc(sp.end||'')}"></div>
        </div>
      </div>`;
    return `
      <div class="card">
        <h3>Season</h3>
        <div style="display:flex;gap:10px;">
          <div class="field" style="flex:1;"><label>Season starts</label><input type="date" id="se-start" value="${esc(s.seasonStart||'')}"></div>
          <div class="field" style="flex:1;"><label>Season ends</label><input type="date" id="se-end" value="${esc(s.seasonEnd||'')}"></div>
        </div>
        <div class="hint">Only points approved inside this window count toward a bonus tier.</div>
      </div>

      <div class="card">
        <h3>Season cash bonus tiers</h3>
        <div class="sm muted" style="margin-bottom:12px;">Add, remove or edit any number. Paid once at the highest tier a worker reaches by season end, on top of the normal pool cash-out.</div>
        <div class="tgrid" style="margin-bottom:6px;">
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Points threshold</span>
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Bonus (RM)</span><span></span>
        </div>
        <div id="tiers">${(s.tiers||[]).map(tierRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-tier" style="width:100%;margin-top:6px;">+ Add tier</button>
      </div>

      <div class="card">
        <h3>SPIFF boosts</h3>
        <div class="sm muted" style="margin-bottom:12px;">Run more than one at once, each on its own sale type with its own multiplier. Matched against the sale type the worker picks when submitting.</div>
        <div id="spiffs">${(s.spiffs||[]).map(spiffRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-spiff" style="width:100%;margin-top:6px;">+ Add SPIFF</button>
      </div>

      <button class="btn btn-primary" id="save-rewards">Save reward settings</button>
      <div class="xs muted">A boost applies at the moment of approval. Changing one here never re-prices a sale that was already approved.</div>`;
  }

  function wireRewards(s){
    const redraw = () => { renderAdmin('rewards'); };
    const collect = () => {
      const tiers = [...document.querySelectorAll('#tiers [data-tier]')].map(d=>({
        threshold: Number(String(d.querySelector('.ti-th').value).replace(/,/g,'')) || 0,
        bonus:     Number(String(d.querySelector('.ti-bo').value).replace(/,/g,'')) || 0
      })).filter(t=>t.threshold > 0);
      const spiffs = [...document.querySelectorAll('#spiffs [data-spiff]')].map(d=>({
        saleType:   d.querySelector('.sp-type').value,
        multiplier: Number(d.querySelector('.sp-mult').value) || 1,
        start:      d.querySelector('.sp-start').value || '',
        end:        d.querySelector('.sp-end').value || ''
      })).filter(x=>x.multiplier > 0);
      return {
        seasonStart: $('se-start').value || '',
        seasonEnd:   $('se-end').value || '',
        tiers, spiffs
      };
    };
    $('add-tier').onclick = async () => { const n = collect(); n.tiers.push({threshold:0,bonus:0}); _settings = n; redraw(); };
    $('add-spiff').onclick = async () => {
      const n = collect();
      n.spiffs.push({ saleType:'new_client', multiplier:2, start:todayStr(), end:'' });
      _settings = n; redraw();
    };
    document.querySelectorAll('[data-rmtier]').forEach(b=> b.onclick = () => {
      const n = collect(); n.tiers.splice(Number(b.dataset.rmtier),1); _settings = n; redraw();
    });
    document.querySelectorAll('[data-rmspiff]').forEach(b=> b.onclick = () => {
      const n = collect(); n.spiffs.splice(Number(b.dataset.rmspiff),1); _settings = n; redraw();
    });
    $('save-rewards').onclick = async function(){
      this.disabled = true; this.textContent = 'Saving…';
      const ok = await saveSettings(collect());
      this.disabled = false; this.textContent = 'Save reward settings';
      toast(ok ? 'Reward settings saved' : 'Could not save');
    };
  }

  // ---------- Redeem ----------
  // Settling is the whole balance at the standard rate — there is no amount
  // to decide, so there is nothing to type and nothing to get wrong. The
  // ledger below is the permanent record of what has gone out.
  const LEDGER_PAGE = 50;
  let _ledger = { worker:'', page:0 };

  function viewRedeem(awards, workers, redemptions, settings){
    const live = activeOnly(workers);
    const bonuses = bonusesDue(workers, awards, redemptions, settings);
    const owed = bonuses.filter(b => !b.paid);
    const owedRM = owed.reduce((t,b)=> t + Number(b.tier.bonus||0), 0);
    const rows = live.map(w => Object.assign({ w }, balanceOf(w.id, awards, redemptions)))
      .filter(r => r.balance > 0)
      .sort((a,b)=> b.balance - a.balance);
    const outstanding = rows.reduce((t,r)=> t + r.balance, 0);
    const period = new Date().toLocaleString('en-MY',{month:'short', year:'numeric'}) + ' payroll';

    // Filtered and paged here rather than in the query: the whole ledger is
    // already loaded for the balances, and slicing it costs nothing.
    const filtered = _ledger.worker
      ? redemptions.filter(r => r.workerId === _ledger.worker)
      : redemptions;
    const pages = Math.max(1, Math.ceil(filtered.length / LEDGER_PAGE));
    const page = Math.min(_ledger.page, pages - 1);
    const slice = filtered.slice(page * LEDGER_PAGE, (page + 1) * LEDGER_PAGE);
    const from = filtered.length ? page * LEDGER_PAGE + 1 : 0;
    const to = page * LEDGER_PAGE + slice.length;

    return `
      <div class="narrow">
      <div class="stats">
        <div class="stat"><div class="n">${rows.length}</div><div class="l">Workers with a balance</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">${pts(outstanding)} pts</div><div class="l">Outstanding · RM ${rm(outstanding * RM_PER_POINT)}</div></div>
        <div class="stat"><div class="n"${owedRM?' style="color:var(--green);"':''}>RM ${rm(owedRM)}</div><div class="l">Season bonus owed</div></div>
      </div>

      ${bonuses.length ? `
      <div class="card">
        <h3>Season cash bonus</h3>
        <div class="sm muted" style="margin-bottom:12px;">Paid once per season at the highest tier a worker reaches. This is RM on top of their points — paying it does not touch their balance.</div>
        <div class="wrap" style="border:none;"><table class="t">
          <tr><th>Worker</th><th>Season points</th><th>Tier reached</th><th>Bonus</th><th></th></tr>
          ${bonuses.map(b=>`<tr>
            <td><b>${esc(b.w.name)}</b></td>
            <td>${pts(b.seasonPoints)} pts</td>
            <td>${pts(b.tier.threshold)} pts</td>
            <td><b>RM ${rm(b.tier.bonus)}</b></td>
            <td>${b.paid
              ? `<span class="chip c-paid">Paid ${fmtDate(b.paid.redeemedAt)}</span>`
              : `<button class="btn btn-sm btn-gold" data-bonus="${esc(b.w.id)}">Pay bonus</button>`}</td>
          </tr>`).join('')}
        </table></div>
      </div>` : ''}

      <div class="card">
        <h3>Redeem points</h3>
        <div class="sm muted" style="margin-bottom:12px;">Settles a worker's whole balance at RM ${rm(RM_PER_POINT)} per point and records it against their name.</div>
        <div class="field"><label>Worker</label>
          <select id="rd-worker">
            <option value="">Select a worker…</option>
            ${rows.map(r=>`<option value="${esc(r.w.id)}" data-pts="${r.balance}">${esc(r.w.name)} — ${pts(r.balance)} pts</option>`).join('')}
          </select>
        </div>
        <div id="rd-sum"></div>
        <div class="field"><label>Note — optional</label><input id="rd-note" value="${esc(period)}"></div>
        <button class="btn btn-primary" id="rd-go">Record redemption</button>
        <div id="rd-msg" class="sm" style="margin-top:10px;"></div>
        ${rows.length ? '' : '<div class="xs muted" style="margin-top:10px;">Nobody has points to redeem yet.</div>'}
      </div>

      <div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
          <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);">Points ledger</div>
          <div class="field" style="margin:0;width:240px;max-width:50%;">
            <select id="lg-worker">
              <option value="">All workers</option>
              ${live.map(w=>`<option value="${esc(w.id)}"${w.id===_ledger.worker?' selected':''}>${esc(w.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${slice.length ? `
        <div class="wrap"><table class="t">
          <tr><th>Date</th><th>Worker</th><th>Points</th><th>Amount</th><th>Note</th></tr>
          ${slice.map(r=>`<tr>
            <td><b>${fmtDate(r.redeemedAt)}</b></td>
            <td>${esc(r.workerName)}${r.kind === 'bonus' ? '<div class="tagline t-boost">Season bonus</div>' : ''}</td>
            <td>${r.kind === 'bonus' ? '<span class="muted">—</span>' : '<span style="color:var(--red);">−' + pts(r.points) + '</span>'}</td>
            <td><b>RM ${rm(r.amount)}</b></td>
            <td class="xs muted">${esc(r.note||'—')}</td>
          </tr>`).join('')}
        </table></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;">
          <span class="xs muted">Showing ${from}–${to} of ${filtered.length}</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm btn-ghost" id="lg-prev"${page === 0 ? ' disabled' : ''}>‹ Previous</button>
            <button class="btn btn-sm btn-ghost" id="lg-next"${page >= pages - 1 ? ' disabled' : ''}>Next ›</button>
          </div>
        </div>` : `<div class="card"><div class="empty">Nothing redeemed yet.</div></div>`}
        <div class="xs muted" style="margin-top:8px;">The ledger is permanent — a redemption cannot be edited once recorded.</div>
      </div>
      </div>`;
  }

  function wireRedeem(awards, workers, redemptions, settings){
    const sel = $('rd-worker');
    const sum = $('rd-sum');

    // The amount is never typed: it is the balance at the standard rate, so
    // what is shown here is exactly what gets written.
    const refresh = () => {
      const id = sel.value;
      if(!id){ sum.innerHTML = ''; return; }
      const bal = balanceOf(id, awards, redemptions).balance;
      sum.innerHTML = `<div class="banner b-green" style="margin-bottom:12px;"><span>
        <b>${pts(bal)} pts</b> × RM ${rm(RM_PER_POINT)} = <b>RM ${rm(bal * RM_PER_POINT)}</b>
        <div class="xs" style="margin-top:3px;">Their balance drops to zero.</div></span></div>`;
    };
    sel.onchange = refresh;

    $('rd-go').onclick = async function(){
      const msg = $('rd-msg');
      const workerId = sel.value;
      msg.style.color = 'var(--red)';
      if(!workerId){ msg.textContent = 'Pick a worker.'; return; }
      const w = workers.find(x => x.id === workerId);
      const bal = balanceOf(workerId, awards, redemptions).balance;
      if(bal <= 0){ msg.textContent = 'That worker has nothing to redeem.'; return; }
      const amount = Number((bal * RM_PER_POINT).toFixed(2));
      if(!confirm(`Redeem ${w.name}'s balance?\n\n${pts(bal)} pts = RM ${rm(amount)}\n\n`
        + `Their balance drops to zero. This cannot be undone.`)) return;

      this.disabled = true; this.textContent = 'Recording…';
      try{
        await recordRedemption({ workerId, workerName:w.name,
          label:'RM ' + rm(amount), points:bal, amount, note:$('rd-note').value.trim() });
        toast('Redeemed — RM ' + rm(amount));
        _ledger.page = 0;
        renderAdmin('redeem');
      }catch(e){
        console.error('redemption failed:', e);
        this.disabled = false; this.textContent = 'Record redemption';
        msg.textContent = e.message || 'Could not record — try again.';
      }
    };

    document.querySelectorAll('[data-bonus]').forEach(btn=>{
      btn.onclick = async () => {
        const b = bonusesDue(workers, awards, redemptions, settings)
          .find(x => x.w.id === btn.dataset.bonus);
        if(!b) return;
        if(!confirm(`Pay ${b.w.name}'s season bonus?\n\n`
          + `RM ${rm(b.tier.bonus)} for reaching the ${pts(b.tier.threshold)} pt tier.\n`
          + `Their points balance is not affected.`)) return;
        btn.disabled = true; btn.textContent = 'Paying…';
        try{
          await recordRedemption({
            workerId:b.w.id, workerName:b.w.name, kind:'bonus', seasonKey:b.key,
            label:'Season bonus — ' + pts(b.tier.threshold) + ' pt tier',
            points:0, amount:Number(b.tier.bonus), note:$('rd-note') ? $('rd-note').value.trim() : null
          });
          toast('Bonus paid — RM ' + rm(b.tier.bonus));
          renderAdmin('redeem');
        }catch(e){
          console.error('bonus failed:', e);
          btn.disabled = false; btn.textContent = 'Pay bonus';
          toast(e.message || 'Could not pay — try again');
        }
      };
    });

    const lg = $('lg-worker');
    if(lg) lg.onchange = () => { _ledger.worker = lg.value; _ledger.page = 0; renderAdmin('redeem'); };
    const prev = $('lg-prev'), next = $('lg-next');
    if(prev) prev.onclick = () => { if(_ledger.page > 0){ _ledger.page--; renderAdmin('redeem'); } };
    if(next) next.onclick = () => { _ledger.page++; renderAdmin('redeem'); };
  }

  boot();
})();
</script>
</body>
</html>
