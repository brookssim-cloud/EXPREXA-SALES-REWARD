  async function renderAdminGate(){
    if(sessionStorage.getItem('epx_admin_unlocked') === '1') return renderAdmin('pending');
    // The same portal shell the workers sign in through. The admin screens
    // themselves are wide because they hold tables; the way in is one field,
    // and in the wide shell it read as a small card adrift in empty space.
    root.innerHTML = `
      <div class="worker-shell">
        <div class="worker-hero">
          <div class="co">Exprexa Sales &amp; Reward</div>
          <div class="sub">Admin</div>
          <a class="admin-in" href="#" id="to-worker">Worker</a>
        </div>
        <div class="worker-body signin">
          <div class="eyebrow" style="margin-bottom:10px;">Admin sign in</div>
          <div class="field"><label>Admin password</label>
            <input type="password" id="ad-pass" placeholder="••••••" autocomplete="current-password"></div>
          <button class="btn btn-primary btn-block" id="ad-go">Log In</button>
          <div id="ad-msg" style="margin-top:9px;font-size:12.5px;"></div>
          <div class="xs muted" style="margin-top:14px;line-height:1.5;">
            Same admin password as the attendance app.
          </div>
        </div>
      </div>`;
    // Cleans #admin out of the bar rather than leaving a bare # behind, so
    // the address can be copied to a worker as-is.
    $('to-worker').onclick = e => {
      e.preventDefault();
      dropHash();
      renderLogin();
    };
    $('ad-pass').focus();

    const go = async () => {
      const btn = $('ad-go'), msg = $('ad-msg');
      btn.disabled = true; btn.textContent = 'Checking…';
      const stored = await getAdminHash();
      if(!stored){
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color='var(--red)';
        msg.textContent = 'No admin password is set in the attendance app yet.';
        return;
      }
      const hash = await sha256Hex($('ad-pass').value);
      if(hash === stored){
        sessionStorage.setItem('epx_admin_unlocked','1');
        renderAdmin('pending');
      }else{
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color='var(--red)'; msg.textContent = 'Incorrect password.';
      }
    };
    $('ad-go').onclick = go;
    $('ad-pass').onkeydown = e => { if(e.key==='Enter') go(); };
  }

  const ADMIN_TABS = [
    ['pending','To review'], ['progress','In progress'], ['approved','Approved'], ['rejected','Rejected'],
    ['rewards','Rewards'], ['payout','Payouts']
  ];

  async function renderAdmin(tab){
    const tabs = `<div class="tabs">${ADMIN_TABS.map(([k,l])=>
      `<button class="tab${k===tab?' active':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;

    root.innerHTML = shell('','Loading…','<div class="empty">Loading…</div>', { tag:'Admin', wide:true, tabs });
    document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=> renderAdmin(b.dataset.tab));

    const [subs, awards, settings, workers] = await Promise.all([
      getSubmissions(), getAwards(), getSettings(), getWorkers()
    ]);

    let body = '';
    if(tab === 'pending')        body = viewPending(subs, settings);
    else if(tab === 'progress')  body = viewProgress(subs, settings);
    else if(tab === 'approved') body = viewApproved(subs, awards);
    else if(tab === 'rejected') body = viewRejected(subs);
    else if(tab === 'rewards')  body = viewRewards(settings);
    else if(tab === 'payout')   body = await viewPayout(awards, workers);

    root.innerHTML = shell('', ADMIN_TABS.find(t=>t[0]===tab)[1], body, { tag:'Admin', wide:true, tabs });
    document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=> renderAdmin(b.dataset.tab));

    if(tab === 'pending') wirePending(subs, settings);
    if(tab === 'rewards') wireRewards(settings);
    if(tab === 'payout')  wirePayout(awards, workers);
    wirePdfLinks();
    labelTableCells();
  }

  // Copies each column's heading onto the cells below it, so the phone layout
  // can print the label beside the value. Doing it here keeps the table markup
  // free of a data attribute repeated on every cell.
  function labelTableCells(){
    document.querySelectorAll('table.t').forEach(t=>{
      const rows = [...t.rows];
      if(!rows.length) return;
      const heads = [...rows[0].cells].map(c=>c.textContent.trim());
      rows.slice(1).forEach(r=>{
        [...r.cells].forEach((c,i)=>{ if(heads[i]) c.setAttribute('data-l', heads[i]); });
      });
    });
  }

  // An invoice in Drive is just a link. One still held in Firestore has to be
  // fetched and opened by hand, so the two cases render differently.
  function wirePdfLinks(){
    document.querySelectorAll('[data-pdf]').forEach(a=>{
      a.onclick = async e => {
        e.preventDefault();
        const label = a.textContent;
        a.textContent = 'Opening…';
        const f = await getFileDoc(a.dataset.pdf, a.dataset.stage);
        a.textContent = label;
        if(!f) return toast('No file stored for this one');
        const w = window.open();
        if(w) w.document.write(`<iframe src="${f.dataUrl}" style="border:0;width:100%;height:100%;position:absolute;inset:0;"></iframe>`);
      };
    });
  }

  // The three documents behind a sale, each opening from Drive or from the
  // Firestore fallback depending on where it was filed.
  function docLinks(s){
    return STAGES.map(st=>{
      const d = s.docs && s.docs[st.id];
      if(!d) return `<span class="doclink off">${esc(st.doc)}</span>`;
      return d.url
        ? `<a class="doclink" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(st.doc)}</a>`
        : `<a class="doclink" href="#" data-pdf="${esc(s.id)}" data-stage="${esc(st.id)}">${esc(st.doc)}</a>`;
    }).join('');
  }

  // ---------- Pending ----------
  function viewPending(subs, settings){
    const pending = subs.filter(s=>s.status === 'pending');
    const value = pending.reduce((t,s)=> t + Number(s.billingValue||0), 0);
    const withRef = pending.filter(s=>s.referrerId).length;
    if(!pending.length) return `<div class="card"><div class="empty">Nothing waiting for review.</div></div>`;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${pending.length}</div><div class="l">Pending review</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">RM ${rm(value)}</div><div class="l">Value pending</div></div>
        <div class="stat"><div class="n">${withRef}</div><div class="l">Naming a referrer</div></div>
      </div>
      ${withRef ? `<div class="banner b-blue">${withRef} of these name a referrer — approving them awards the same points to both workers.</div>` : ''}
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Value</th><th>Points</th><th></th></tr>
        ${pending.map(s=>{
          const p = projectedPoints(s, settings);
          return `<tr>
            <td><b>${esc(s.workerName)}</b>${s.referrerId?`<div class="tagline t-ref">+ ${esc(s.referrerName)} · referral</div>`:''}</td>
            <td>${esc(subTitle(s))}<div class="xs muted">${esc(saleTypeLabel(s.saleType))}</div>
                <div class="xs muted">Ordered ${fmtDate(s.submittedAt)}</div></td>
            <td>${esc(s.invoiceNo)}<div class="xs muted">${esc(s.pickupNo||'—')}</div></td>
            <td>${docLinks(s)}</td>
            <td>RM ${rm(s.billingValue)}</td>
            <td><b>${pts(p.points)}</b>${p.mult>1?`<div class="tagline t-boost">${esc(String(p.mult))}× SPIFF</div>`:''}
                ${s.referrerId?`<div class="tagline t-ref">×2 payees</div>`:''}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-sm btn-gold" data-ok="${esc(s.id)}">Approve</button>
              <button class="btn btn-sm btn-ghost" data-no="${esc(s.id)}">Reject</button>
            </td></tr>`;
        }).join('')}
      </table></div>
      <div class="xs muted">All four documents and the invoice figures are in on every row here. The boost shown is the one that was live on the order date, which is what will be awarded.</div>`;
  }

  // ---------- In progress ----------
  // Sales still collecting documents. Nothing to approve yet; this is for
  // seeing what is outstanding and chasing it.
  function viewProgress(subs, settings){
    const open = subs.filter(s=>s.status === 'collecting')
      .sort((a,b)=> String(a.submittedAt||'').localeCompare(String(b.submittedAt||'')));
    if(!open.length) return `<div class="card"><div class="empty">Nothing in progress.</div></div>`;
    const projected = open.reduce((t,s)=> t + projectedPoints(s, settings).points, 0);
    const waiting = st => open.filter(s => (nextStage(s)||{}).id === st).length;
    const age = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/86400000));
    return `
      <div class="stats">
        <div class="stat"><div class="n">${open.length}</div><div class="l">Sales in progress</div></div>
        <div class="stat"><div class="n">${waiting('payment')}</div><div class="l">Awaiting payment slip</div></div>
        <div class="stat"><div class="n">${waiting('pod')}</div><div class="l">Awaiting delivery proof</div></div>
      </div>
      <div class="banner b-grey">${pts(projected)} pts projected across these — not awarded until every document is in and approved. Sales without an invoice yet have no value to count.</div>
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Documents</th><th>Waiting on</th><th>Value</th><th>Age</th></tr>
        ${open.map(s=>{
          const nx = nextStage(s);
          const days = age(s.submittedAt);
          return `<tr>
            <td><b>${esc(s.workerName)}</b></td>
            <td>${esc(subTitle(s))}<div class="xs muted">${esc(saleTypeLabel(s.saleType))}</div></td>
            <td class="xs">${s.invoiceNo ? esc(s.invoiceNo) : '<span class="muted">not invoiced</span>'}</td>
            <td>${docLinks(s)}</td>
            <td>${nx?`<span class="chip c-hold">${esc(nx.doc)}</span>`:''}</td>
            <td>${hasValue(s) ? 'RM ' + rm(s.billingValue) : '<span class="muted">—</span>'}</td>
            <td class="xs ${days>30?'':'muted'}" ${days>30?'style="color:var(--red);font-weight:700;"':''}>${days} days</td>
          </tr>`;
        }).join('')}
      </table></div>`;
  }

  function wirePending(subs, settings){
    document.querySelectorAll('[data-ok]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.ok);
        if(!sub) return;
        const who = sub.referrerId ? `${sub.workerName} and ${sub.referrerName}` : sub.workerName;
        const p = projectedPoints(sub, settings);
        if(!confirm(`Approve this sale?\n\n${pts(p.points)} pts to ${who}.\n`
          + `Straight into the pool — delivery is already proven, so there is no hold.`)) return;
        b.disabled = true; b.textContent = 'Approving…';
        try{
          const r = await approveSubmission(sub, settings);
          toast(`Approved — ${pts(r.points)} pts${sub.referrerId?' each':''}`);
          renderAdmin('pending');
        }catch(e){
          console.error('approve failed:', e);
          b.disabled = false; b.textContent = 'Approve';
          toast('Could not approve — try again');
        }
      };
    });
    document.querySelectorAll('[data-no]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.no);
        if(!sub) return;
        const reason = prompt('Why is this being rejected?\nThe worker sees this and can fix and resubmit.');
        if(reason === null) return;
        if(!reason.trim()) return toast('A reason is needed');
        b.disabled = true;
        const ok = await rejectSubmission(sub, reason.trim());
        toast(ok ? 'Rejected' : 'Could not reject');
        renderAdmin('pending');
      };
    });
  }

  // ---------- Hold ----------
  // ---------- Approved ----------
  function viewApproved(subs, awards){
    const approved = subs.filter(s=>s.status === 'approved');
    if(!approved.length) return `<div class="card"><div class="empty">Nothing approved yet.</div></div>`;
    const cleared = awards.filter(isPooled);
    return `
      <div class="stats">
        <div class="stat"><div class="n">${approved.length}</div><div class="l">Approved</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">${pts(sumPts(awards))} pts</div><div class="l">Points awarded — incl referral</div></div>
        <div class="stat"><div class="n">RM ${rm(sumPts(cleared) * RM_PER_POINT)}</div><div class="l">Awaiting payout</div></div>
      </div>
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Type</th><th>Points awarded</th><th>Approved</th><th>Status</th></tr>
        ${approved.map(s=>{
          const own = awards.find(a=>a.submissionId===s.id && a.kind==='own');
          const ref = awards.find(a=>a.submissionId===s.id && a.kind==='referral');
          const state = !own ? '<span class="chip c-pend">—</span>'
            : isPaid(own) ? '<span class="chip c-paid">Paid</span>'
            : isPooled(own) ? '<span class="chip c-pool">In pool</span>'
            : '<span class="chip c-pool">In pool</span>';
          return `<tr>
            <td><b>${esc(s.workerName)}</b></td>
            <td>${esc(subTitle(s))}</td>
            <td class="xs">${esc(s.invoiceNo||'—')}
                ${docLinks(s)}</td>
            <td class="xs">${esc(saleTypeLabel(s.saleType))}</td>
            <td><b>${pts(s.awardedPoints)}</b>
                <div class="xs muted">RM ${rm(s.billingValue)}${Number(s.multiplier)>1?' × '+s.multiplier+' SPIFF':' · no boost'}</div>
                ${ref?`<div class="tagline t-ref">+ ${pts(ref.points)} pts → ${esc(s.referrerName)}</div>`:''}</td>
            <td class="xs muted">${fmtDate(s.approvedAt)}</td>
            <td>${state}</td>
          </tr>`;
        }).join('')}
      </table></div>
      <div class="xs muted">Points are final at whatever SPIFF was live on the approval date — ending a boost later never changes a sale already approved.</div>`;
  }

  // ---------- Rejected ----------
  function viewRejected(subs){
    const rej = subs.filter(s=>s.status === 'rejected');
    if(!rej.length) return `<div class="card"><div class="empty">Nothing rejected.</div></div>`;
    return `<div class="wrap"><table class="t">
      <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Value</th><th>Reason</th><th>When</th></tr>
      ${rej.map(s=>`<tr>
        <td><b>${esc(s.workerName)}</b></td>
        <td>${esc(subTitle(s))}</td>
        <td class="xs">${esc(s.invoiceNo||'—')}${docLinks(s)}</td>
        <td>${hasValue(s) ? 'RM ' + rm(s.billingValue) : '—'}</td>
        <td class="sm" style="color:var(--red);">${esc(s.rejectReason||'—')}</td>
        <td class="xs muted">${fmtDate(s.rejectedAt)}</td>
      </tr>`).join('')}
    </table></div>
    <div class="xs muted">A rejected sale stays with the worker, who can correct it and submit again.</div>`;
  }

  // ---------- Rewards ----------
  function viewRewards(s){
    const tierRow = (t,i) => `
      <div class="tgrid" style="margin-bottom:8px;" data-tier="${i}">
        <input class="ti-th" inputmode="numeric" value="${esc(t.threshold)}" placeholder="Points">
        <input class="ti-bo" inputmode="decimal" value="${esc(t.bonus)}" placeholder="RM bonus">
        <button class="btn btn-sm btn-danger" data-rmtier="${i}">✕</button>
      </div>`;
    const spiffRow = (sp,i) => `
      <div class="card" style="padding:12px;margin-bottom:10px;" data-spiff="${i}">
        <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap;">
          <div class="field" style="flex:1 1 140px;margin:0;">
            <label>Boosted sale type</label>
            <select class="sp-type">${SALE_TYPES.map(t=>
              `<option value="${t.id}"${t.id===sp.saleType?' selected':''}>${esc(t.label)}</option>`).join('')}</select>
          </div>
          <div class="field" style="width:84px;margin:0;">
            <label>Mult.</label><input class="sp-mult" inputmode="decimal" value="${esc(sp.multiplier)}">
          </div>
          <button class="btn btn-sm btn-danger" data-rmspiff="${i}">✕</button>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="field" style="flex:1;margin:0;"><label>Starts</label><input type="date" class="sp-start" value="${esc(sp.start||'')}"></div>
          <div class="field" style="flex:1;margin:0;"><label>Ends</label><input type="date" class="sp-end" value="${esc(sp.end||'')}"></div>
        </div>
      </div>`;
    return `
      <div class="card">
        <h3>Season</h3>
        <div style="display:flex;gap:10px;">
          <div class="field" style="flex:1;"><label>Season starts</label><input type="date" id="se-start" value="${esc(s.seasonStart||'')}"></div>
          <div class="field" style="flex:1;"><label>Season ends</label><input type="date" id="se-end" value="${esc(s.seasonEnd||'')}"></div>
        </div>
        <div class="hint">Only points approved inside this window count toward a bonus tier.</div>
      </div>

      <div class="card">
        <h3>Season cash bonus tiers</h3>
        <div class="sm muted" style="margin-bottom:12px;">Add, remove or edit any number. Paid once at the highest tier a worker reaches by season end, on top of the normal pool cash-out.</div>
        <div class="tgrid" style="margin-bottom:6px;">
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Points threshold</span>
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Bonus (RM)</span><span></span>
        </div>
        <div id="tiers">${(s.tiers||[]).map(tierRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-tier" style="width:100%;margin-top:6px;">+ Add tier</button>
      </div>

      <div class="card">
        <h3>SPIFF boosts</h3>
        <div class="sm muted" style="margin-bottom:12px;">Run more than one at once, each on its own sale type with its own multiplier. Matched against the sale type the worker picks when submitting.</div>
        <div id="spiffs">${(s.spiffs||[]).map(spiffRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-spiff" style="width:100%;margin-top:6px;">+ Add SPIFF</button>
      </div>

      <button class="btn btn-primary" id="save-rewards">Save reward settings</button>
      <div class="xs muted">A boost applies at the moment of approval. Changing one here never re-prices a sale that was already approved.</div>`;
  }

  function wireRewards(s){
    const redraw = () => { renderAdmin('rewards'); };
    const collect = () => {
      const tiers = [...document.querySelectorAll('#tiers [data-tier]')].map(d=>({
        threshold: Number(String(d.querySelector('.ti-th').value).replace(/,/g,'')) || 0,
        bonus:     Number(String(d.querySelector('.ti-bo').value).replace(/,/g,'')) || 0
      })).filter(t=>t.threshold > 0);
      const spiffs = [...document.querySelectorAll('#spiffs [data-spiff]')].map(d=>({
        saleType:   d.querySelector('.sp-type').value,
        multiplier: Number(d.querySelector('.sp-mult').value) || 1,
        start:      d.querySelector('.sp-start').value || '',
        end:        d.querySelector('.sp-end').value || ''
      })).filter(x=>x.multiplier > 0);
      return {
        seasonStart: $('se-start').value || '',
        seasonEnd:   $('se-end').value || '',
        tiers, spiffs
      };
    };
    $('add-tier').onclick = async () => { const n = collect(); n.tiers.push({threshold:0,bonus:0}); _settings = n; redraw(); };
    $('add-spiff').onclick = async () => {
      const n = collect();
      n.spiffs.push({ saleType:'new_client', multiplier:2, start:todayStr(), end:'' });
      _settings = n; redraw();
    };
    document.querySelectorAll('[data-rmtier]').forEach(b=> b.onclick = () => {
      const n = collect(); n.tiers.splice(Number(b.dataset.rmtier),1); _settings = n; redraw();
    });
    document.querySelectorAll('[data-rmspiff]').forEach(b=> b.onclick = () => {
      const n = collect(); n.spiffs.splice(Number(b.dataset.rmspiff),1); _settings = n; redraw();
    });
    $('save-rewards').onclick = async function(){
      this.disabled = true; this.textContent = 'Saving…';
      const ok = await saveSettings(collect());
      this.disabled = false; this.textContent = 'Save reward settings';
      toast(ok ? 'Reward settings saved' : 'Could not save');
    };
  }

  // ---------- Payouts ----------
  async function viewPayout(awards, workers){
    const payouts = await getPayouts();
    const pooled = awards.filter(isPooled);
    const byWorker = {};
    pooled.forEach(a=>{
      const k = a.workerId;
      if(!byWorker[k]) byWorker[k] = { workerId:k, points:0, awardIds:[] };
      byWorker[k].points += Number(a.points||0);
      byWorker[k].awardIds.push(a.id);
    });
    const rows = Object.values(byWorker)
      .map(r=>({ ...r, workerName: workerName(workers, r.workerId), amount: r.points * RM_PER_POINT }))
      .filter(r=>r.points > 0)
      .sort((a,b)=> b.points - a.points);

    const total = rows.reduce((t,r)=> t + r.amount, 0);
    const period = new Date().toLocaleString('en-MY',{month:'short', year:'numeric'}) + ' payroll';

    return `
      <div class="stats">
        <div class="stat"><div class="n">${rows.length}</div><div class="l">Workers ready to pay</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">RM ${rm(total)}</div><div class="l">Total pool value</div></div>
        <div class="stat"><div class="n">${payouts.length}</div><div class="l">Payout runs to date</div></div>
      </div>

      ${rows.length ? `
      <div class="card">
        <div class="field"><label>Payroll period</label><input id="pp" value="${esc(period)}"></div>
        <div class="hint" style="margin-bottom:12px;">Every record in this run is stamped with this, so the amounts can be matched against the payroll sheet later.</div>
        <div class="wrap" style="border:none;">
          <table class="t">
            <tr><th></th><th>Worker</th><th>Pool points</th><th>Amount (RM)</th></tr>
            ${rows.map((r,i)=>`<tr>
              <td><input type="checkbox" class="pay-cb" data-i="${i}" checked style="width:18px;height:18px;"></td>
              <td><b>${esc(r.workerName)}</b></td>
              <td>${pts(r.points)} pts</td>
              <td><b>${rm(r.amount)}</b></td>
            </tr>`).join('')}
          </table>
        </div>
        <div class="balance" style="margin-top:14px;padding:16px;">
          <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);">This run</div>
          <div style="font-size:21px;font-weight:800;margin-top:3px;" id="run-sum">${rows.length} worker${rows.length===1?'':'s'} · RM ${rm(total)}</div>
          <div class="sm" style="color:#AEB8CC;margin-top:3px;">Full balance only · pools reset on confirm</div>
          <button class="btn btn-gold" id="do-pay" style="width:100%;margin-top:12px;">Record payout</button>
        </div>
      </div>` : `<div class="card"><div class="empty">Nothing has cleared its 30-day hold yet.</div></div>`}

      ${payouts.length ? `
      <div>
        <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px;">Payout history</div>
        <div class="wrap"><table class="t">
          <tr><th>Date</th><th>Payroll period</th><th>Workers</th><th>Points</th><th>Amount</th></tr>
          ${payouts.map(p=>`<tr>
            <td><b>${fmtDate(p.runAt)}</b></td>
            <td>${esc(p.payrollPeriod)}</td>
            <td>${p.workerCount}</td>
            <td>${pts(p.totalPoints)} pts</td>
            <td><b>RM ${rm(p.totalAmount)}</b></td>
          </tr>`).join('')}
        </table></div>
        <div class="xs muted" style="margin-top:6px;">Runs are permanent — amounts and pool resets cannot be edited after recording.</div>
      </div>` : ''}`;
  }

  function wirePayout(awards, workers){
    const pooled = awards.filter(isPooled);
    const byWorker = {};
    pooled.forEach(a=>{
      if(!byWorker[a.workerId]) byWorker[a.workerId] = { workerId:a.workerId, points:0, awardIds:[] };
      byWorker[a.workerId].points += Number(a.points||0);
      byWorker[a.workerId].awardIds.push(a.id);
    });
    const rows = Object.values(byWorker)
      .map(r=>({ ...r, workerName: workerName(workers, r.workerId), amount: r.points * RM_PER_POINT }))
      .filter(r=>r.points > 0)
      .sort((a,b)=> b.points - a.points);
    if(!rows.length) return;

    const picked = () => [...document.querySelectorAll('.pay-cb')]
      .filter(cb=>cb.checked).map(cb=> rows[Number(cb.dataset.i)]);

    const refresh = () => {
      const sel = picked();
      $('run-sum').textContent = sel.length + ' worker' + (sel.length===1?'':'s')
        + ' · RM ' + rm(sel.reduce((t,r)=>t+r.amount,0));
    };
    document.querySelectorAll('.pay-cb').forEach(cb=> cb.onchange = refresh);

    $('do-pay').onclick = async function(){
      const sel = picked();
      if(!sel.length) return toast('Nobody selected');
      const period = $('pp').value.trim();
      if(!period) return toast('Enter the payroll period');
      const amt = rm(sel.reduce((t,r)=>t+r.amount,0));
      if(!confirm(`Record this payout?\n\n${sel.length} worker(s) · RM ${amt}\nStamped to: ${period}\n\nTheir pools reset to zero. This cannot be undone.`)) return;
      this.disabled = true; this.textContent = 'Recording…';
      try{
        await recordPayout(period, sel);
        toast('Payout recorded — RM ' + amt);
        renderAdmin('payout');
      }catch(e){
        console.error('recordPayout failed:', e);
        this.disabled = false; this.textContent = 'Record payout';
        toast('Could not record — try again');
      }
    };
  }

  boot();
})();
</script>
</body>
</html>
