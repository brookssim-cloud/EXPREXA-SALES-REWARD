<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXPREXA SALES &amp; REWARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same tokens as EXPREXA ATTENDANCE — the two apps sit side by side on the
     same phones, so they have to look like one system, not two products. */
  :root{
    --ink:#14213D;
    --ink-2:#1D2E52;
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --amber:#F2A93B;
    --amber-dark:#C97F12;
    --green:#1F9D6B;
    --red:#D64545;
    --blue:#2F5C8A;
    --blue-soft:#EAF1F8;
    --text:#1B2333;
    --muted:#67708A;
    --line:#DCE1EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}
  .app.wide{max-width:1180px;}
  .topbar{background:var(--ink);color:#fff;padding:16px 18px 14px;position:relative;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .brand .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;}
  .brand .tag{border:1px solid var(--amber);color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:3px 9px;border-radius:6px;}
  .topbar .sub{font-size:12.5px;color:#AEB8CC;margin-top:4px;}
  .topbar .out{position:absolute;right:16px;top:16px;background:transparent;border:1px solid #38466A;color:#C3CBDD;
    font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;}

  .tabs{display:flex;gap:2px;overflow-x:auto;background:var(--ink);padding:0 10px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#AEB8CC;font-size:13.5px;
    font-weight:600;padding:9px 13px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .tab.active{color:#fff;border-bottom-color:var(--amber);}

  .content{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;}
  /* The bottom nav is sticky, so the last field needs room to clear it when
     the form is scrolled all the way down. */
  .has-nav .content{padding-bottom:76px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .card h3{margin:0 0 12px;font-size:15.5px;font-family:'Space Grotesk',sans-serif;}
  .muted{color:var(--muted);}
  .sm{font-size:12.5px;}
  .xs{font-size:11.5px;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .field input,.field select,.field textarea{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 13px;
    font-size:15px;font-family:inherit;color:var(--text);background:#fff;width:100%;}
  .field textarea{height:auto;min-height:76px;padding:11px 13px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:-2px;}

  .btn{border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13.5px;padding:0 16px;height:46px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--ink);color:#fff;width:100%;letter-spacing:.03em;text-transform:uppercase;}
  .btn-gold{background:var(--amber);color:var(--ink);letter-spacing:.03em;text-transform:uppercase;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted);}
  .btn-danger{background:#fff;border:1px solid #F0CDD0;color:var(--red);}
  .btn-sm{height:36px;font-size:12px;padding:0 13px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat .n{font-size:24px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
  .stat .l{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

  .balance{background:var(--ink);border-radius:var(--radius);padding:20px;color:#fff;}
  .balance .big{font-size:33px;font-weight:800;font-family:'Space Grotesk',sans-serif;line-height:1.1;}
  .balance .rm{font-size:15px;font-weight:700;color:var(--amber);margin-top:3px;}
  .split{display:flex;gap:8px;margin-top:14px;}
  .split > div{flex:1;background:var(--ink-2);border-radius:9px;padding:9px 11px;}
  .split .k{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8E9AB5;}
  .split .v{font-size:16px;font-weight:800;margin-top:2px;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #EEF1F5;}
  .row:last-child{border-bottom:none;}
  .chip{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;}
  .c-pool{background:#E6F5EE;color:var(--green);}
  .c-hold{background:#FDF2DF;color:var(--amber-dark);}
  .c-pend{background:#EDEFF3;color:var(--muted);}
  .c-rej{background:#FBEAEA;color:var(--red);}
  .c-ref{background:var(--blue-soft);color:var(--blue);}
  .c-paid{background:#EDEFF3;color:var(--muted);}

  .banner{border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.45;display:flex;gap:9px;align-items:flex-start;}
  .b-gold{background:#FDF2DF;border:1px solid #F3DCA9;color:#7A5410;}
  .b-green{background:#E6F5EE;border:1px solid #BCE3D1;color:#146848;}
  .b-blue{background:var(--blue-soft);border:1px solid #C4D8EA;color:#244A6E;}
  .b-grey{background:#F4F6F9;border:1px solid var(--line);color:var(--muted);}
  .b-red{background:#FBEAEA;border:1px solid #F0CDD0;color:var(--red);}

  .bar{height:8px;background:#E8EBF0;border-radius:999px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--amber);}
  .bar.dark{background:#2A3A5C;}

  .drop{border:1.5px dashed #C3CBDA;border-radius:10px;padding:18px;text-align:center;color:var(--muted);
    font-size:13px;cursor:pointer;background:#fff;}
  .drop.has{border-style:solid;border-color:var(--green);color:var(--green);background:#F5FBF8;}

  .list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:2px 14px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;}

  .nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);}
  .nav button{flex:1;background:none;border:none;padding:9px 0 11px;font-family:inherit;font-size:10.5px;font-weight:600;
    color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .nav button.on{color:var(--amber-dark);}

  table.t{width:100%;border-collapse:collapse;font-size:13px;}
  table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.t td{padding:11px 8px;border-bottom:1px solid #EEF1F5;vertical-align:top;}
  table.t tr:last-child td{border-bottom:none;}
  .wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
  .tagline{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:3px;white-space:nowrap;}
  .t-boost{background:#FDF2DF;color:var(--amber-dark);border:1px solid #F3DCA9;}
  .t-ref{background:var(--blue-soft);color:var(--blue);border:1px solid #C4D8EA;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 6px 24px rgba(20,33,61,.3);max-width:88%;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
(function(){
  'use strict';

  // ===================================================================
  // EXPREXA SALES & REWARD
  //
  // Runs on the SAME Firebase project as EXPREXA ATTENDANCE (dispatch-clock)
  // on purpose: the worker roster, their passwords and the admin password
  // already live there. Duplicating them into a second project would mean two
  // lists drifting apart and workers remembering two passwords.
  //
  // Everything this app owns is prefixed epx_sales_ so it sits beside the
  // attendance collections without ever colliding with them.
  // ===================================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCDzNm4W1D9NVp9l60JEiZOSCaCQNnyr3c",
    authDomain: "dispatch-clock.firebaseapp.com",
    projectId: "dispatch-clock",
    storageBucket: "dispatch-clock.firebasestorage.app",
    messagingSenderId: "562921093074",
    appId: "1:562921093074:web:efe0e6393a83014c3d3a0b"
  };
  let db = null;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){ console.error('Firebase init failed:', e); }

  // ---------- Rules of the scheme ----------
  const POINTS_PER_RM   = 1;      // RM1 of billing value = 1 point
  const RM_PER_POINT    = 0.01;   // 1 point = RM0.01  →  a flat 1% commission
  const HOLD_DAYS       = 30;     // per submission, from its own approval date
  const MAX_PDF_BYTES   = 700*1024;

  const SALE_TYPES = [
    { id:'new_client', label:'New client signed' },
    { id:'upsell',     label:'Upsell / new lane, existing client' },
    { id:'referral',   label:'Lead referral' }
  ];
  const saleTypeLabel = id => (SALE_TYPES.find(t=>t.id===id)||{}).label || id || '—';

  // ---------- Small helpers ----------
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d)) return '—';
    return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear();
  }
  function addDays(iso, n){
    const d = new Date(iso);
    d.setDate(d.getDate() + n);
    return d.toISOString();
  }
  function daysLeft(iso){
    const ms = new Date(iso).getTime() - Date.now();
    return ms <= 0 ? 0 : Math.ceil(ms / 86400000);
  }
  function pts(n){ return Number(n||0).toLocaleString('en-MY'); }
  function rm(n){ return Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function toast(msg){
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2800);
  }
  const $ = id => document.getElementById(id);

  // ===================================================================
  // Data layer
  // ===================================================================

  // Workers come from the attendance app untouched — this app never creates,
  // edits or deletes one.
  //
  // Everyone is loaded, resigned included: someone who leaves mid-season can
  // still have points sitting in the pool that are owed to them, and their
  // name has to keep resolving on old records. Only the places where a LIVE
  // choice is made — the login list and the referrer picker — filter them out.
  let _workers = null;
  async function getWorkers(){
    if(_workers) return _workers;
    if(!db) return [];
    try{
      const snap = await db.collection('epx_workers').get();
      _workers = snap.docs.map(d=>d.data());
      _workers.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')));
      return _workers;
    }catch(e){ console.error('getWorkers failed:', e); return []; }
  }
  const activeOnly = list => (list||[]).filter(w=>!w.resigned);
  const workerName = (list,id) => (list.find(w=>w.id===id)||{}).name || 'Unknown';

  // The admin password is the attendance app's — one password, both apps.
  async function getAdminHash(){
    try{
      const doc = await db.collection('epx_config').doc('main').get();
      return doc.exists ? (doc.data().adminPasswordHash || null) : null;
    }catch(e){ console.error('getAdminHash failed:', e); return null; }
  }

  // Scheme settings: season window, bonus tiers, SPIFF boosts.
  const DEFAULT_SETTINGS = { seasonStart:'', seasonEnd:'', tiers:[], spiffs:[] };
  let _settings = null;
  async function getSettings(){
    if(_settings) return _settings;
    if(!db) return { ...DEFAULT_SETTINGS };
    try{
      const doc = await db.collection('epx_sales_config').doc('main').get();
      _settings = doc.exists ? { ...DEFAULT_SETTINGS, ...doc.data() } : { ...DEFAULT_SETTINGS };
      return _settings;
    }catch(e){ console.error('getSettings failed:', e); return { ...DEFAULT_SETTINGS }; }
  }
  async function saveSettings(s){
    try{
      await db.collection('epx_sales_config').doc('main').set(s);
      _settings = s;
      return true;
    }catch(e){ console.error('saveSettings failed:', e); return false; }
  }

  // Submissions. Sorted in JS rather than with orderBy so no composite index
  // has to exist before the app will run.
  async function getSubmissions(){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_submissions').get();
      return snap.docs.map(d=>d.data())
        .sort((a,b)=> String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));
    }catch(e){ console.error('getSubmissions failed:', e); return []; }
  }
  async function getSubmissionsFor(workerId){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_submissions').where('workerId','==',workerId).get();
      return snap.docs.map(d=>d.data())
        .sort((a,b)=> String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));
    }catch(e){ console.error('getSubmissionsFor failed:', e); return []; }
  }
  async function saveSubmission(s){
    try{ await db.collection('epx_sales_submissions').doc(s.id).set(s); return true; }
    catch(e){ console.error('saveSubmission failed:', e); return false; }
  }

  // The invoice PDF is kept in its own collection, the same trick the
  // attendance app uses for IC photos: the file is only ever fetched when
  // someone actually opens it, so listing submissions stays light.
  async function savePdf(subId, dataUrl, filename){
    try{ await db.collection('epx_sales_files').doc(subId).set({ dataUrl, filename }); return true; }
    catch(e){ console.error('savePdf failed:', e); return false; }
  }
  async function getPdf(subId){
    try{
      const doc = await db.collection('epx_sales_files').doc(subId).get();
      return doc.exists ? doc.data() : null;
    }catch(e){ console.error('getPdf failed:', e); return null; }
  }

  // ---------- Awards ----------
  // One document per point award, NOT per submission. A referred sale makes
  // two of them — kind 'own' and kind 'referral' — so the referrer's points
  // need no special case anywhere downstream: they hold, pool and get paid
  // through exactly the same code as the submitter's.
  //
  // There is no server here to run a nightly job, so nothing ever "moves"
  // points out of hold. An award is simply pooled once its holdUntil has
  // passed, worked out at read time. That makes the 30-day rule impossible
  // to get wrong by missing a cron run.
  async function getAwards(){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_awards').get();
      return snap.docs.map(d=>d.data());
    }catch(e){ console.error('getAwards failed:', e); return []; }
  }
  async function getAwardsFor(workerId){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_awards').where('workerId','==',workerId).get();
      return snap.docs.map(d=>d.data());
    }catch(e){ console.error('getAwardsFor failed:', e); return []; }
  }
  const isPaid   = a => a.state === 'paid';
  const isPooled = a => a.state !== 'paid' && new Date(a.holdUntil).getTime() <= Date.now();
  const inHold   = a => a.state !== 'paid' && new Date(a.holdUntil).getTime() >  Date.now();
  const sumPts   = list => list.reduce((t,a)=> t + Number(a.points||0), 0);

  // ---------- Payout runs ----------
  async function getPayouts(){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_payouts').get();
      return snap.docs.map(d=>d.data())
        .sort((a,b)=> String(b.runAt||'').localeCompare(String(a.runAt||'')));
    }catch(e){ console.error('getPayouts failed:', e); return []; }
  }
  async function getPayoutLines(payoutId){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_payout_lines').where('payoutId','==',payoutId).get();
      return snap.docs.map(d=>d.data());
    }catch(e){ console.error('getPayoutLines failed:', e); return []; }
  }
  async function getPayoutLinesFor(workerId){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_sales_payout_lines').where('workerId','==',workerId).get();
      return snap.docs.map(d=>d.data())
        .sort((a,b)=> String(b.runAt||'').localeCompare(String(a.runAt||'')));
    }catch(e){ console.error('getPayoutLinesFor failed:', e); return []; }
  }

  // ---------- SPIFF matching ----------
  // Which boost applies to a sale type on a given day. Multiple boosts can be
  // live at once; if two cover the same sale type the better one wins rather
  // than whichever happens to be first in the list.
  function spiffFor(settings, saleType, whenISO){
    const when = (whenISO || new Date().toISOString()).slice(0,10);
    let best = null;
    (settings.spiffs||[]).forEach(s=>{
      if(s.saleType !== saleType) return;
      if(s.start && when < s.start) return;
      if(s.end   && when > s.end)   return;
      const m = Number(s.multiplier);
      if(!isFinite(m) || m <= 0) return;
      if(!best || m > Number(best.multiplier)) best = s;
    });
    return best;
  }

  // ---------- Approving ----------
  // Writing the submission and both awards together means a half-approved
  // sale cannot exist: either the points are owed to everyone they are owed
  // to, or the approval did not happen.
  async function approveSubmission(sub, settings){
    const now = new Date().toISOString();
    const holdUntil = addDays(now, HOLD_DAYS);
    const boost = spiffFor(settings, sub.saleType, now);
    const mult = boost ? Number(boost.multiplier) : 1;
    const base = Math.round(Number(sub.billingValue||0) * POINTS_PER_RM);
    const points = Math.round(base * mult);

    const batch = db.batch();
    const subRef = db.collection('epx_sales_submissions').doc(sub.id);
    batch.set(subRef, {
      ...sub,
      status:'approved', approvedAt:now, holdUntil,
      basePoints:base, multiplier:mult, awardedPoints:points,
      spiffLabel: boost ? (mult + '× ' + saleTypeLabel(sub.saleType)) : null,
      rejectReason:null
    });

    const mkAward = (workerId, kind) => {
      const id = uid();
      batch.set(db.collection('epx_sales_awards').doc(id), {
        id, submissionId:sub.id, workerId, kind,
        points, approvedAt:now, holdUntil, state:'held',
        payoutId:null, paidAt:null,
        billingName:sub.billingName, invoiceNo:sub.invoiceNo, saleType:sub.saleType
      });
    };
    mkAward(sub.workerId, 'own');
    if(sub.referrerId) mkAward(sub.referrerId, 'referral');

    await batch.commit();
    return { points, mult, boost };
  }

  async function rejectSubmission(sub, reason){
    try{
      await db.collection('epx_sales_submissions').doc(sub.id).set({
        ...sub, status:'rejected', rejectReason:reason, rejectedAt:new Date().toISOString()
      });
      return true;
    }catch(e){ console.error('rejectSubmission failed:', e); return false; }
  }

  // ---------- Recording a payout ----------
  // Awards are flipped to 'paid' rather than zeroed, and a line is written for
  // every worker in the run. The pool is always derived from awards, so it
  // drops to zero by itself and the history behind it stays readable.
  async function recordPayout(period, rows){
    const now = new Date().toISOString();
    const payoutId = uid();
    const totalPts = rows.reduce((t,r)=> t + r.points, 0);
    const totalAmt = rows.reduce((t,r)=> t + r.amount, 0);

    const batch = db.batch();
    batch.set(db.collection('epx_sales_payouts').doc(payoutId), {
      id:payoutId, payrollPeriod:period, runAt:now,
      workerCount:rows.length, totalPoints:totalPts, totalAmount:totalAmt
    });
    rows.forEach(r=>{
      const lineId = uid();
      batch.set(db.collection('epx_sales_payout_lines').doc(lineId), {
        id:lineId, payoutId, runAt:now, payrollPeriod:period,
        workerId:r.workerId, workerName:r.workerName, points:r.points, amount:r.amount
      });
      r.awardIds.forEach(aid=>{
        batch.set(db.collection('epx_sales_awards').doc(aid),
          { state:'paid', payoutId, paidAt:now }, { merge:true });
      });
    });
    await batch.commit();
    return payoutId;
  }

  // ===================================================================
  // Screens
  // ===================================================================
  const root = $('root');
  let WORKER = null;   // logged-in worker, or null

  function shell(title, sub, body, opts){
    opts = opts || {};
    return `
      <div class="app${opts.wide?' wide':''}${opts.nav?' has-nav':''}">
        <div class="topbar">
          <div class="brand"><span class="name">EXPREXA SALES</span><span class="tag">${esc(opts.tag||'Reward')}</span></div>
          <div class="sub">${esc(sub||'')}</div>
          ${opts.logout ? '<button class="out" id="logout">Log out</button>' : ''}
        </div>
        ${opts.tabs||''}
        <div class="content">${body}</div>
        ${opts.nav||''}
      </div>`;
  }

  // ---------- Entry ----------
  async function start(){
    if(!db){
      root.innerHTML = shell('','', '<div class="banner b-red">Could not reach the database. Check the connection and reload.</div>');
      return;
    }
    const hash = location.hash.replace(/^#/,'');
    if(hash === 'admin') return renderAdminGate();
    return renderLogin();
  }
  window.addEventListener('hashchange', ()=>{
    WORKER = null;
    start();
  });

  // ---------- Worker login ----------
  // Same name-and-password pair as the attendance app, checked against the
  // same epx_workers record. Nothing new for anyone to remember.
  async function renderLogin(){
    root.innerHTML = shell('','Commission & reward', `
      <div class="card">
        <h3>Log in</h3>
        <div class="field">
          <label>Your name</label>
          <select id="lg-name"><option value="">Loading…</option></select>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="lg-pass" placeholder="Same as the attendance app" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="lg-go">Log In</button>
        <div id="lg-msg" class="sm" style="margin-top:10px;"></div>
      </div>
      <div class="xs muted" style="text-align:center;">Admin? <a href="#admin" style="color:var(--ink);">Open the admin screen</a></div>
    `);

    const workers = activeOnly(await getWorkers());
    const sel = $('lg-name');
    sel.innerHTML = '<option value="">Select your name…</option>' +
      workers.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');

    const go = async () => {
      const id = sel.value, pass = $('lg-pass').value, msg = $('lg-msg'), btn = $('lg-go');
      if(!id){ msg.style.color='var(--red)'; msg.textContent='Please select your name.'; return; }
      if(!pass){ msg.style.color='var(--red)'; msg.textContent='Please enter your password.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      const w = workers.find(x=>x.id===id);
      const hash = await sha256Hex(pass);
      if(!w || hash !== w.passwordHash){
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color='var(--red)'; msg.textContent='Incorrect name or password.';
        return;
      }
      WORKER = w;
      renderSubmit();
    };
    $('lg-go').onclick = go;
    $('lg-pass').onkeydown = e => { if(e.key === 'Enter') go(); };
  }

  function workerNav(active){
    const item = (k,label) => `<button class="${active===k?'on':''}" data-nav="${k}">${label}</button>`;
    return `<div class="nav">${item('submit','Submit Sale')}${item('pool','My Pool')}</div>`;
  }
  function wireWorkerNav(){
    document.querySelectorAll('[data-nav]').forEach(b=>{
      b.onclick = () => b.dataset.nav === 'submit' ? renderSubmit() : renderPool();
    });
    const lo = $('logout');
    if(lo) lo.onclick = () => { WORKER = null; renderLogin(); };
  }

  // ---------- Submit a sale ----------
  async function renderSubmit(){
    const settings = await getSettings();
    const workers = await getWorkers();
    const others = activeOnly(workers).filter(w=>w.id !== WORKER.id);

    const live = (settings.spiffs||[]).filter(s=>{
      const d = todayStr();
      return (!s.start || d >= s.start) && (!s.end || d <= s.end);
    });
    const spiffLine = live.length
      ? `<div class="banner b-gold">★ Live boosts: ${live.map(s=>`<b>${esc(s.multiplier)}× ${esc(saleTypeLabel(s.saleType))}</b>`).join(' · ')}</div>`
      : '';

    root.innerHTML = shell('','Submit a sale for approval', `
      ${spiffLine}
      <div class="stats">
        <div class="stat"><div class="n" style="font-size:17px;">${esc(WORKER.name)}</div><div class="l">Worker</div></div>
        <div class="stat"><div class="n" style="font-size:17px;">${fmtDate(new Date().toISOString())}</div><div class="l">Date</div></div>
      </div>
      <div class="card">
        <div class="field">
          <label>Sale type</label>
          <select id="f-type">
            <option value="">Select sale type…</option>
            ${SALE_TYPES.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('')}
          </select>
        </div>
        <div id="spiff-box"></div>
        <div class="field">
          <label>Referred by — optional</label>
          <select id="f-ref">
            <option value="">No one — I brought this in myself</option>
            ${others.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}
          </select>
          <div class="hint">A teammate who helped bring this in. They earn the same points you do.</div>
        </div>
        <div id="ref-box"></div>
        <div class="field"><label>Billing name</label><input id="f-bill" placeholder="e.g. ABC Trading Sdn Bhd"></div>
        <div class="field"><label>Pickup form number</label><input id="f-pf" placeholder="e.g. PF-10234"></div>
        <div class="field"><label>Invoice / OR number</label><input id="f-inv" placeholder="e.g. INV-88210"></div>
        <div class="field"><label>Billing value before tax (RM)</label><input id="f-val" inputmode="decimal" placeholder="0.00"></div>
        <div class="field">
          <label>Invoice PDF</label>
          <div class="drop" id="f-drop">Tap to attach the PDF</div>
          <input type="file" id="f-pdf" accept="application/pdf" style="display:none;">
          <div class="hint">Up to 700 KB. Larger scans need compressing first.</div>
        </div>
        <button class="btn btn-primary" id="f-go">Submit for approval</button>
        <div id="f-msg" class="sm" style="margin-top:10px;"></div>
      </div>
    `, { logout:true, nav:workerNav('submit') });
    wireWorkerNav();

    // Live SPIFF feedback, so the worker sees the boost before they finish
    // filling the form rather than after an admin approves it.
    const onType = () => {
      const t = $('f-type').value;
      const box = $('spiff-box');
      if(!t){ box.innerHTML = ''; return; }
      const b = spiffFor(settings, t, new Date().toISOString());
      box.innerHTML = b
        ? `<div class="banner b-green" style="margin-bottom:12px;">✓ Qualifies for <b>${esc(b.multiplier)}× SPIFF</b> — ${esc(saleTypeLabel(t))}</div>`
        : `<div class="banner b-grey" style="margin-bottom:12px;">No active boost for ${esc(saleTypeLabel(t))} — standard points apply</div>`;
    };
    $('f-type').onchange = onType;

    $('f-ref').onchange = () => {
      const id = $('f-ref').value;
      $('ref-box').innerHTML = id
        ? `<div class="banner b-blue" style="margin-bottom:12px;"><span><b>${esc(workerName(workers,id))}</b> earns the same points once this is approved</span></div>`
        : '';
    };

    let pdfData = null, pdfName = null;
    $('f-drop').onclick = () => $('f-pdf').click();
    $('f-pdf').onchange = e => {
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > MAX_PDF_BYTES){
        $('f-drop').className = 'drop';
        $('f-msg').style.color = 'var(--red)';
        $('f-msg').textContent = 'That PDF is ' + Math.round(file.size/1024) + ' KB — the limit is 700 KB. Compress it and try again.';
        pdfData = null; return;
      }
      const r = new FileReader();
      r.onload = () => {
        pdfData = r.result; pdfName = file.name;
        $('f-drop').className = 'drop has';
        $('f-drop').textContent = '✓ ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)';
        $('f-msg').textContent = '';
      };
      r.readAsDataURL(file);
    };

    $('f-go').onclick = async function(){
      const msg = $('f-msg');
      const saleType = $('f-type').value;
      const billingName = $('f-bill').value.trim();
      const pickupNo = $('f-pf').value.trim();
      const invoiceNo = $('f-inv').value.trim();
      const value = parseFloat(String($('f-val').value).replace(/,/g,''));
      const referrerId = $('f-ref').value || null;

      msg.style.color = 'var(--red)';
      if(!saleType){ msg.textContent = 'Pick a sale type.'; return; }
      if(!billingName){ msg.textContent = 'Enter the billing name.'; return; }
      if(!invoiceNo){ msg.textContent = 'Enter the invoice or OR number.'; return; }
      if(!isFinite(value) || value <= 0){ msg.textContent = 'Enter the billing value before tax.'; return; }
      if(!pdfData){ msg.textContent = 'Attach the invoice PDF.'; return; }

      this.disabled = true; this.textContent = 'Submitting…';
      const id = uid();
      const sub = {
        id, workerId:WORKER.id, workerName:WORKER.name,
        date:todayStr(), submittedAt:new Date().toISOString(),
        saleType, billingName, pickupNo, invoiceNo,
        billingValue:value,
        referrerId, referrerName: referrerId ? workerName(workers, referrerId) : null,
        hasPdf:true, pdfName,
        status:'pending',
        approvedAt:null, holdUntil:null, rejectReason:null,
        basePoints:null, multiplier:null, awardedPoints:null, spiffLabel:null
      };
      const okFile = await savePdf(id, pdfData, pdfName);
      const okSub  = okFile && await saveSubmission(sub);
      if(!okSub){
        this.disabled = false; this.textContent = 'Submit for approval';
        msg.textContent = 'Could not submit — try again.';
        return;
      }
      toast('Submitted for approval');
      renderPool();
    };
  }

  // ---------- My Pool ----------
  async function renderPool(){
    root.innerHTML = shell('','Loading…', '<div class="empty">Loading your pool…</div>',
      { logout:true, nav:workerNav('pool') });
    wireWorkerNav();

    const [settings, awards, subs, lines] = await Promise.all([
      getSettings(), getAwardsFor(WORKER.id), getSubmissionsFor(WORKER.id), getPayoutLinesFor(WORKER.id)
    ]);

    const pooled = awards.filter(isPooled);
    const held   = awards.filter(inHold);
    const own    = pooled.filter(a=>a.kind === 'own');
    const ref    = pooled.filter(a=>a.kind === 'referral');
    const balance = sumPts(pooled);

    // Season progress — only counts awards approved inside the season window.
    const inSeason = a => (!settings.seasonStart || a.approvedAt >= settings.seasonStart)
                       && (!settings.seasonEnd   || a.approvedAt <= settings.seasonEnd + 'T23:59:59');
    const seasonPts = sumPts(awards.filter(inSeason));
    const tiers = (settings.tiers||[]).slice().sort((a,b)=> Number(a.threshold) - Number(b.threshold));
    const next = tiers.find(t=> seasonPts < Number(t.threshold));
    const reached = tiers.filter(t=> seasonPts >= Number(t.threshold)).pop();

    const seasonCard = tiers.length ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span class="l xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);">Season cash bonus</span>
          <b style="font-size:14px;">${pts(seasonPts)}${next?' / '+pts(next.threshold):''} pts</b>
        </div>
        <div class="bar" style="margin:9px 0;"><i style="width:${next?Math.min(100, Math.round(seasonPts/Number(next.threshold)*100)):100}%"></i></div>
        <div class="sm muted">${
          next
            ? pts(Number(next.threshold) - seasonPts) + ' pts to the next tier — <b style="color:var(--text);">+ RM ' + rm(next.bonus) + '</b> at ' + pts(next.threshold) + ' pts'
            : (reached ? 'Top tier reached — <b style="color:var(--text);">+ RM ' + rm(reached.bonus) + '</b> due at season end' : 'No tiers set yet')
        }</div>
      </div>` : '';

    const holdCard = held.length ? `
      <div class="balance" style="padding:16px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);">In 30-day hold</span>
          <b>${pts(sumPts(held))} pts</b>
        </div>
        <div class="bar dark" style="margin:9px 0;"><i style="width:${
          Math.round(100 - (daysLeft(held.map(a=>a.holdUntil).sort()[0]) / HOLD_DAYS * 100))
        }%"></i></div>
        <div class="sm" style="color:#AEB8CC;">Next ${pts(held.filter(a=>a.holdUntil===held.map(x=>x.holdUntil).sort()[0]).reduce((t,a)=>t+a.points,0))} pts unlock in ${daysLeft(held.map(a=>a.holdUntil).sort()[0])} days</div>
      </div>` : '';

    // Activity blends the worker's own submissions with points credited to
    // them as a referrer — the referral ones are somebody else's submission,
    // so they are labelled rather than mixed in silently.
    const refRows = awards.filter(a=>a.kind === 'referral').map(a=>({
      when:a.approvedAt, title:a.billingName, sub:a.invoiceNo + ' · referral credit',
      chip:'<span class="chip c-ref">Referral</span>',
      extra:'+ ' + pts(a.points) + ' pts'
    }));
    const ownRows = subs.map(s=>{
      const a = awards.find(x=>x.submissionId===s.id && x.kind==='own');
      let chip = '<span class="chip c-pend">Pending</span>', extra = '';
      if(s.status === 'rejected'){ chip = '<span class="chip c-rej">Rejected</span>'; extra = esc(s.rejectReason||''); }
      else if(a && isPaid(a)){ chip = '<span class="chip c-paid">Paid</span>'; extra = pts(a.points)+' pts'; }
      else if(a && isPooled(a)){ chip = '<span class="chip c-pool">Pooled</span>'; extra = pts(a.points)+' pts'; }
      else if(a && inHold(a)){ chip = '<span class="chip c-hold">In hold</span>'; extra = daysLeft(a.holdUntil)+' days left'; }
      return { when:s.submittedAt, title:s.billingName, sub:s.invoiceNo+' · RM '+rm(s.billingValue), chip, extra };
    });
    const activity = ownRows.concat(refRows)
      .sort((a,b)=> String(b.when||'').localeCompare(String(a.when||'')))
      .slice(0,15);

    root.innerHTML = shell('','Commission points & payout', `
      <div class="balance">
        <div class="sm" style="color:#AEB8CC;">Pool balance</div>
        <div class="big">${pts(balance)} pts</div>
        <div class="rm">≈ RM ${rm(balance * RM_PER_POINT)}</div>
        <div class="split">
          <div><div class="k">My sales</div><div class="v">${pts(sumPts(own))} pts</div></div>
          <div><div class="k">Referral</div><div class="v">${pts(sumPts(ref))} pts</div></div>
        </div>
        <div class="sm" style="color:#AEB8CC;margin-top:11px;">Paid out through payroll — 1 pt = RM 0.01</div>
      </div>
      ${seasonCard}
      ${holdCard}
      <div>
        <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Recent activity</div>
        <div class="list">${
          activity.length ? activity.map(r=>`
            <div class="row">
              <div><div style="font-weight:700;font-size:14px;">${esc(r.title)}</div><div class="xs muted">${esc(r.sub)}</div></div>
              <div style="text-align:right;">${r.chip}<div class="xs muted" style="margin-top:3px;">${r.extra}</div></div>
            </div>`).join('') : '<div class="empty">Nothing submitted yet.</div>'
        }</div>
      </div>
      ${lines.length ? `
      <div>
        <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Payout history</div>
        <div class="list">${lines.map(l=>`
          <div class="row">
            <div><div style="font-weight:700;font-size:14px;">${esc(l.payrollPeriod)}</div><div class="xs muted">${fmtDate(l.runAt)} · ${pts(l.points)} pts cashed</div></div>
            <b style="color:var(--green);">RM ${rm(l.amount)}</b>
          </div>`).join('')}</div>
      </div>` : ''}
    `, { logout:true, nav:workerNav('pool') });
    wireWorkerNav();
  }

  // ===================================================================
  // Admin
  // ===================================================================
  async function renderAdminGate(){
    if(sessionStorage.getItem('epx_admin_unlocked') === '1') return renderAdmin('pending');
    root.innerHTML = shell('','Admin', `
      <div class="card" style="max-width:420px;margin:0 auto;">
        <h3>Admin login</h3>
        <div class="field"><label>Password</label><input type="password" id="ad-pass" placeholder="Admin password"></div>
        <button class="btn btn-primary" id="ad-go">Log In</button>
        <div id="ad-msg" class="sm" style="margin-top:10px;"></div>
      </div>
      <div class="xs muted" style="text-align:center;">Same admin password as the attendance app.</div>
    `, { tag:'Admin' });

    const go = async () => {
      const btn = $('ad-go'), msg = $('ad-msg');
      btn.disabled = true; btn.textContent = 'Checking…';
      const stored = await getAdminHash();
      if(!stored){
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color='var(--red)';
        msg.textContent = 'No admin password is set in the attendance app yet.';
        return;
      }
      const hash = await sha256Hex($('ad-pass').value);
      if(hash === stored){
        sessionStorage.setItem('epx_admin_unlocked','1');
        renderAdmin('pending');
      }else{
        btn.disabled = false; btn.textContent = 'Log In';
        msg.style.color='var(--red)'; msg.textContent = 'Incorrect password.';
      }
    };
    $('ad-go').onclick = go;
    $('ad-pass').onkeydown = e => { if(e.key==='Enter') go(); };
  }

  const ADMIN_TABS = [
    ['pending','Pending'], ['hold','Hold'], ['approved','Approved'], ['rejected','Rejected'],
    ['rewards','Rewards'], ['payout','Payouts']
  ];

  async function renderAdmin(tab){
    const tabs = `<div class="tabs">${ADMIN_TABS.map(([k,l])=>
      `<button class="tab${k===tab?' active':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;

    root.innerHTML = shell('','Loading…','<div class="empty">Loading…</div>', { tag:'Admin', wide:true, tabs });
    document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=> renderAdmin(b.dataset.tab));

    const [subs, awards, settings, workers] = await Promise.all([
      getSubmissions(), getAwards(), getSettings(), getWorkers()
    ]);

    let body = '';
    if(tab === 'pending')       body = viewPending(subs, settings);
    else if(tab === 'hold')     body = viewHold(awards, workers);
    else if(tab === 'approved') body = viewApproved(subs, awards);
    else if(tab === 'rejected') body = viewRejected(subs);
    else if(tab === 'rewards')  body = viewRewards(settings);
    else if(tab === 'payout')   body = await viewPayout(awards, workers);

    root.innerHTML = shell('', ADMIN_TABS.find(t=>t[0]===tab)[1], body, { tag:'Admin', wide:true, tabs });
    document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=> renderAdmin(b.dataset.tab));

    if(tab === 'pending') wirePending(subs, settings);
    if(tab === 'rewards') wireRewards(settings);
    if(tab === 'payout')  wirePayout(awards, workers);
    wirePdfLinks();
  }

  function wirePdfLinks(){
    document.querySelectorAll('[data-pdf]').forEach(a=>{
      a.onclick = async e => {
        e.preventDefault();
        a.textContent = 'Opening…';
        const f = await getPdf(a.dataset.pdf);
        a.textContent = 'PDF';
        if(!f) return toast('No file stored for this one');
        const w = window.open();
        if(w) w.document.write(`<iframe src="${f.dataUrl}" style="border:0;width:100%;height:100%;position:absolute;inset:0;"></iframe>`);
      };
    });
  }

  // ---------- Pending ----------
  function viewPending(subs, settings){
    const pending = subs.filter(s=>s.status === 'pending');
    const value = pending.reduce((t,s)=> t + Number(s.billingValue||0), 0);
    const withRef = pending.filter(s=>s.referrerId).length;
    if(!pending.length) return `<div class="card"><div class="empty">Nothing waiting for review.</div></div>`;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${pending.length}</div><div class="l">Pending review</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">RM ${rm(value)}</div><div class="l">Value pending</div></div>
        <div class="stat"><div class="n">${withRef}</div><div class="l">Naming a referrer</div></div>
      </div>
      ${withRef ? `<div class="banner b-blue">${withRef} of these name a referrer — approving them awards the same points to both workers.</div>` : ''}
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Type</th><th>Value</th><th>Points</th><th></th></tr>
        ${pending.map(s=>{
          const b = spiffFor(settings, s.saleType, new Date().toISOString());
          const base = Math.round(Number(s.billingValue||0));
          const final = b ? Math.round(base * Number(b.multiplier)) : base;
          return `<tr>
            <td><b>${esc(s.workerName)}</b>${s.referrerId?`<div class="tagline t-ref">+ ${esc(s.referrerName)} · referral</div>`:''}</td>
            <td>${esc(s.billingName)}<div class="xs muted">${fmtDate(s.submittedAt)}</div></td>
            <td>${esc(s.invoiceNo)}<div class="xs muted">${esc(s.pickupNo||'—')}</div>
                <a href="#" data-pdf="${esc(s.id)}" style="color:var(--ink);font-size:12px;font-weight:600;">PDF</a></td>
            <td class="xs">${esc(saleTypeLabel(s.saleType))}</td>
            <td>RM ${rm(s.billingValue)}</td>
            <td><b>${pts(final)}</b>${b?`<div class="tagline t-boost">${esc(b.multiplier)}× SPIFF</div>`:''}
                ${s.referrerId?`<div class="tagline t-ref">×2 payees</div>`:''}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-sm btn-gold" data-ok="${esc(s.id)}">Approve</button>
              <button class="btn btn-sm btn-ghost" data-no="${esc(s.id)}">Reject</button>
            </td></tr>`;
        }).join('')}
      </table></div>`;
  }

  function wirePending(subs, settings){
    document.querySelectorAll('[data-ok]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.ok);
        if(!sub) return;
        const who = sub.referrerId ? `${sub.workerName} and ${sub.referrerName}` : sub.workerName;
        if(!confirm(`Approve this sale?\n\nPoints go to ${who}.\nThe 30-day hold starts today.`)) return;
        b.disabled = true; b.textContent = 'Approving…';
        try{
          const r = await approveSubmission(sub, settings);
          toast(`Approved — ${pts(r.points)} pts${sub.referrerId?' each':''}`);
          renderAdmin('pending');
        }catch(e){
          console.error('approve failed:', e);
          b.disabled = false; b.textContent = 'Approve';
          toast('Could not approve — try again');
        }
      };
    });
    document.querySelectorAll('[data-no]').forEach(b=>{
      b.onclick = async () => {
        const sub = subs.find(s=>s.id === b.dataset.no);
        if(!sub) return;
        const reason = prompt('Why is this being rejected?\nThe worker sees this and can fix and resubmit.');
        if(reason === null) return;
        if(!reason.trim()) return toast('A reason is needed');
        b.disabled = true;
        const ok = await rejectSubmission(sub, reason.trim());
        toast(ok ? 'Rejected' : 'Could not reject');
        renderAdmin('pending');
      };
    });
  }

  // ---------- Hold ----------
  function viewHold(awards, workers){
    const held = awards.filter(inHold).sort((a,b)=> String(a.holdUntil).localeCompare(String(b.holdUntil)));
    if(!held.length) return `<div class="card"><div class="empty">Nothing in hold.</div></div>`;
    const soon = held.filter(a=> daysLeft(a.holdUntil) <= 7).length;
    return `
      <div class="stats">
        <div class="stat"><div class="n">${held.length}</div><div class="l">In 30-day hold</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">${pts(sumPts(held))} pts</div><div class="l">Points held</div></div>
        <div class="stat"><div class="n">${soon}</div><div class="l">Unlocking within 7 days</div></div>
      </div>
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Points</th><th>Approved</th><th>Progress</th><th>Unlocks</th></tr>
        ${held.map(a=>{
          const left = daysLeft(a.holdUntil);
          const pct = Math.max(0, Math.min(100, Math.round((HOLD_DAYS - left) / HOLD_DAYS * 100)));
          return `<tr>
            <td><b>${esc(workerName(workers, a.workerId))}</b>${a.kind==='referral'?'<div class="tagline t-ref">referral</div>':''}</td>
            <td>${esc(a.billingName||'—')}</td>
            <td class="xs">${esc(a.invoiceNo||'—')}</td>
            <td><b>${pts(a.points)}</b></td>
            <td class="xs muted">${fmtDate(a.approvedAt)}</td>
            <td style="min-width:110px;"><div class="bar"><i style="width:${pct}%"></i></div></td>
            <td><span class="chip c-hold">${left} days</span></td>
          </tr>`;
        }).join('')}
      </table></div>`;
  }

  // ---------- Approved ----------
  function viewApproved(subs, awards){
    const approved = subs.filter(s=>s.status === 'approved');
    if(!approved.length) return `<div class="card"><div class="empty">Nothing approved yet.</div></div>`;
    const cleared = awards.filter(isPooled);
    return `
      <div class="stats">
        <div class="stat"><div class="n">${approved.length}</div><div class="l">Approved</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">${pts(sumPts(awards))} pts</div><div class="l">Points awarded — incl referral</div></div>
        <div class="stat"><div class="n">RM ${rm(sumPts(cleared) * RM_PER_POINT)}</div><div class="l">Awaiting payout</div></div>
      </div>
      <div class="wrap"><table class="t">
        <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Type</th><th>Points awarded</th><th>Approved</th><th>Status</th></tr>
        ${approved.map(s=>{
          const own = awards.find(a=>a.submissionId===s.id && a.kind==='own');
          const ref = awards.find(a=>a.submissionId===s.id && a.kind==='referral');
          const state = !own ? '<span class="chip c-pend">—</span>'
            : isPaid(own) ? '<span class="chip c-paid">Paid</span>'
            : isPooled(own) ? '<span class="chip c-pool">In pool</span>'
            : `<span class="chip c-hold">Hold · ${daysLeft(own.holdUntil)}d</span>`;
          return `<tr>
            <td><b>${esc(s.workerName)}</b></td>
            <td>${esc(s.billingName)}</td>
            <td class="xs">${esc(s.invoiceNo)}
                <a href="#" data-pdf="${esc(s.id)}" style="color:var(--ink);font-weight:600;display:block;">PDF</a></td>
            <td class="xs">${esc(saleTypeLabel(s.saleType))}</td>
            <td><b>${pts(s.awardedPoints)}</b>
                <div class="xs muted">RM ${rm(s.billingValue)}${Number(s.multiplier)>1?' × '+s.multiplier+' SPIFF':' · no boost'}</div>
                ${ref?`<div class="tagline t-ref">+ ${pts(ref.points)} pts → ${esc(s.referrerName)}</div>`:''}</td>
            <td class="xs muted">${fmtDate(s.approvedAt)}</td>
            <td>${state}</td>
          </tr>`;
        }).join('')}
      </table></div>
      <div class="xs muted">Points are final at whatever SPIFF was live on the approval date — ending a boost later never changes a sale already approved.</div>`;
  }

  // ---------- Rejected ----------
  function viewRejected(subs){
    const rej = subs.filter(s=>s.status === 'rejected');
    if(!rej.length) return `<div class="card"><div class="empty">Nothing rejected.</div></div>`;
    return `<div class="wrap"><table class="t">
      <tr><th>Worker</th><th>Billing</th><th>Invoice</th><th>Value</th><th>Reason</th><th>When</th></tr>
      ${rej.map(s=>`<tr>
        <td><b>${esc(s.workerName)}</b></td>
        <td>${esc(s.billingName)}</td>
        <td class="xs">${esc(s.invoiceNo)}<a href="#" data-pdf="${esc(s.id)}" style="color:var(--ink);font-weight:600;display:block;">PDF</a></td>
        <td>RM ${rm(s.billingValue)}</td>
        <td class="sm" style="color:var(--red);">${esc(s.rejectReason||'—')}</td>
        <td class="xs muted">${fmtDate(s.rejectedAt)}</td>
      </tr>`).join('')}
    </table></div>
    <div class="xs muted">A rejected sale stays with the worker, who can correct it and submit again.</div>`;
  }

  // ---------- Rewards ----------
  function viewRewards(s){
    const tierRow = (t,i) => `
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;" data-tier="${i}">
        <input class="ti-th" inputmode="numeric" value="${esc(t.threshold)}" placeholder="Points">
        <input class="ti-bo" inputmode="decimal" value="${esc(t.bonus)}" placeholder="RM bonus">
        <button class="btn btn-sm btn-danger" data-rmtier="${i}">✕</button>
      </div>`;
    const spiffRow = (sp,i) => `
      <div class="card" style="padding:12px;margin-bottom:10px;" data-spiff="${i}">
        <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;">
          <div class="field" style="flex:1;margin:0;">
            <label>Boosted sale type</label>
            <select class="sp-type">${SALE_TYPES.map(t=>
              `<option value="${t.id}"${t.id===sp.saleType?' selected':''}>${esc(t.label)}</option>`).join('')}</select>
          </div>
          <div class="field" style="width:84px;margin:0;">
            <label>Mult.</label><input class="sp-mult" inputmode="decimal" value="${esc(sp.multiplier)}">
          </div>
          <button class="btn btn-sm btn-danger" data-rmspiff="${i}">✕</button>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="field" style="flex:1;margin:0;"><label>Starts</label><input type="date" class="sp-start" value="${esc(sp.start||'')}"></div>
          <div class="field" style="flex:1;margin:0;"><label>Ends</label><input type="date" class="sp-end" value="${esc(sp.end||'')}"></div>
        </div>
      </div>`;
    return `
      <div class="card">
        <h3>Season</h3>
        <div style="display:flex;gap:10px;">
          <div class="field" style="flex:1;"><label>Season starts</label><input type="date" id="se-start" value="${esc(s.seasonStart||'')}"></div>
          <div class="field" style="flex:1;"><label>Season ends</label><input type="date" id="se-end" value="${esc(s.seasonEnd||'')}"></div>
        </div>
        <div class="hint">Only points approved inside this window count toward a bonus tier.</div>
      </div>

      <div class="card">
        <h3>Season cash bonus tiers</h3>
        <div class="sm muted" style="margin-bottom:12px;">Add, remove or edit any number. Paid once at the highest tier a worker reaches by season end, on top of the normal pool cash-out.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;">
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Points threshold</span>
          <span class="xs" style="font-weight:700;text-transform:uppercase;color:var(--muted);">Bonus (RM)</span><span></span>
        </div>
        <div id="tiers">${(s.tiers||[]).map(tierRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-tier" style="width:100%;margin-top:6px;">+ Add tier</button>
      </div>

      <div class="card">
        <h3>SPIFF boosts</h3>
        <div class="sm muted" style="margin-bottom:12px;">Run more than one at once, each on its own sale type with its own multiplier. Matched against the sale type the worker picks when submitting.</div>
        <div id="spiffs">${(s.spiffs||[]).map(spiffRow).join('')}</div>
        <button class="btn btn-ghost btn-sm" id="add-spiff" style="width:100%;margin-top:6px;">+ Add SPIFF</button>
      </div>

      <button class="btn btn-primary" id="save-rewards">Save reward settings</button>
      <div class="xs muted">A boost applies at the moment of approval. Changing one here never re-prices a sale that was already approved.</div>`;
  }

  function wireRewards(s){
    const redraw = () => { renderAdmin('rewards'); };
    const collect = () => {
      const tiers = [...document.querySelectorAll('#tiers [data-tier]')].map(d=>({
        threshold: Number(String(d.querySelector('.ti-th').value).replace(/,/g,'')) || 0,
        bonus:     Number(String(d.querySelector('.ti-bo').value).replace(/,/g,'')) || 0
      })).filter(t=>t.threshold > 0);
      const spiffs = [...document.querySelectorAll('#spiffs [data-spiff]')].map(d=>({
        saleType:   d.querySelector('.sp-type').value,
        multiplier: Number(d.querySelector('.sp-mult').value) || 1,
        start:      d.querySelector('.sp-start').value || '',
        end:        d.querySelector('.sp-end').value || ''
      })).filter(x=>x.multiplier > 0);
      return {
        seasonStart: $('se-start').value || '',
        seasonEnd:   $('se-end').value || '',
        tiers, spiffs
      };
    };
    $('add-tier').onclick = async () => { const n = collect(); n.tiers.push({threshold:0,bonus:0}); _settings = n; redraw(); };
    $('add-spiff').onclick = async () => {
      const n = collect();
      n.spiffs.push({ saleType:'new_client', multiplier:2, start:todayStr(), end:'' });
      _settings = n; redraw();
    };
    document.querySelectorAll('[data-rmtier]').forEach(b=> b.onclick = () => {
      const n = collect(); n.tiers.splice(Number(b.dataset.rmtier),1); _settings = n; redraw();
    });
    document.querySelectorAll('[data-rmspiff]').forEach(b=> b.onclick = () => {
      const n = collect(); n.spiffs.splice(Number(b.dataset.rmspiff),1); _settings = n; redraw();
    });
    $('save-rewards').onclick = async function(){
      this.disabled = true; this.textContent = 'Saving…';
      const ok = await saveSettings(collect());
      this.disabled = false; this.textContent = 'Save reward settings';
      toast(ok ? 'Reward settings saved' : 'Could not save');
    };
  }

  // ---------- Payouts ----------
  async function viewPayout(awards, workers){
    const payouts = await getPayouts();
    const pooled = awards.filter(isPooled);
    const byWorker = {};
    pooled.forEach(a=>{
      const k = a.workerId;
      if(!byWorker[k]) byWorker[k] = { workerId:k, points:0, awardIds:[] };
      byWorker[k].points += Number(a.points||0);
      byWorker[k].awardIds.push(a.id);
    });
    const rows = Object.values(byWorker)
      .map(r=>({ ...r, workerName: workerName(workers, r.workerId), amount: r.points * RM_PER_POINT }))
      .filter(r=>r.points > 0)
      .sort((a,b)=> b.points - a.points);

    const total = rows.reduce((t,r)=> t + r.amount, 0);
    const period = new Date().toLocaleString('en-MY',{month:'short', year:'numeric'}) + ' payroll';

    return `
      <div class="stats">
        <div class="stat"><div class="n">${rows.length}</div><div class="l">Workers ready to pay</div></div>
        <div class="stat"><div class="n" style="color:var(--amber-dark);">RM ${rm(total)}</div><div class="l">Total pool value</div></div>
        <div class="stat"><div class="n">${payouts.length}</div><div class="l">Payout runs to date</div></div>
      </div>

      ${rows.length ? `
      <div class="card">
        <div class="field"><label>Payroll period</label><input id="pp" value="${esc(period)}"></div>
        <div class="hint" style="margin-bottom:12px;">Every record in this run is stamped with this, so the amounts can be matched against the payroll sheet later.</div>
        <div class="wrap" style="border:none;">
          <table class="t">
            <tr><th></th><th>Worker</th><th>Pool points</th><th>Amount (RM)</th></tr>
            ${rows.map((r,i)=>`<tr>
              <td><input type="checkbox" class="pay-cb" data-i="${i}" checked style="width:18px;height:18px;"></td>
              <td><b>${esc(r.workerName)}</b></td>
              <td>${pts(r.points)} pts</td>
              <td><b>${rm(r.amount)}</b></td>
            </tr>`).join('')}
          </table>
        </div>
        <div class="balance" style="margin-top:14px;padding:16px;">
          <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);">This run</div>
          <div style="font-size:21px;font-weight:800;margin-top:3px;" id="run-sum">${rows.length} workers · RM ${rm(total)}</div>
          <div class="sm" style="color:#AEB8CC;margin-top:3px;">Full balance only · pools reset on confirm</div>
          <button class="btn btn-gold" id="do-pay" style="width:100%;margin-top:12px;">Record payout</button>
        </div>
      </div>` : `<div class="card"><div class="empty">Nothing has cleared its 30-day hold yet.</div></div>`}

      ${payouts.length ? `
      <div>
        <div class="xs" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px;">Payout history</div>
        <div class="wrap"><table class="t">
          <tr><th>Date</th><th>Payroll period</th><th>Workers</th><th>Points</th><th>Amount</th></tr>
          ${payouts.map(p=>`<tr>
            <td><b>${fmtDate(p.runAt)}</b></td>
            <td>${esc(p.payrollPeriod)}</td>
            <td>${p.workerCount}</td>
            <td>${pts(p.totalPoints)} pts</td>
            <td><b>RM ${rm(p.totalAmount)}</b></td>
          </tr>`).join('')}
        </table></div>
        <div class="xs muted" style="margin-top:6px;">Runs are permanent — amounts and pool resets cannot be edited after recording.</div>
      </div>` : ''}`;
  }

  function wirePayout(awards, workers){
    const pooled = awards.filter(isPooled);
    const byWorker = {};
    pooled.forEach(a=>{
      if(!byWorker[a.workerId]) byWorker[a.workerId] = { workerId:a.workerId, points:0, awardIds:[] };
      byWorker[a.workerId].points += Number(a.points||0);
      byWorker[a.workerId].awardIds.push(a.id);
    });
    const rows = Object.values(byWorker)
      .map(r=>({ ...r, workerName: workerName(workers, r.workerId), amount: r.points * RM_PER_POINT }))
      .filter(r=>r.points > 0)
      .sort((a,b)=> b.points - a.points);
    if(!rows.length) return;

    const picked = () => [...document.querySelectorAll('.pay-cb')]
      .filter(cb=>cb.checked).map(cb=> rows[Number(cb.dataset.i)]);

    const refresh = () => {
      const sel = picked();
      $('run-sum').textContent = sel.length + ' worker' + (sel.length===1?'':'s')
        + ' · RM ' + rm(sel.reduce((t,r)=>t+r.amount,0));
    };
    document.querySelectorAll('.pay-cb').forEach(cb=> cb.onchange = refresh);

    $('do-pay').onclick = async function(){
      const sel = picked();
      if(!sel.length) return toast('Nobody selected');
      const period = $('pp').value.trim();
      if(!period) return toast('Enter the payroll period');
      const amt = rm(sel.reduce((t,r)=>t+r.amount,0));
      if(!confirm(`Record this payout?\n\n${sel.length} worker(s) · RM ${amt}\nStamped to: ${period}\n\nTheir pools reset to zero. This cannot be undone.`)) return;
      this.disabled = true; this.textContent = 'Recording…';
      try{
        await recordPayout(period, sel);
        toast('Payout recorded — RM ' + amt);
        renderAdmin('payout');
      }catch(e){
        console.error('recordPayout failed:', e);
        this.disabled = false; this.textContent = 'Record payout';
        toast('Could not record — try again');
      }
    };
  }

  start();
})();
</script>
</body>
</html>
